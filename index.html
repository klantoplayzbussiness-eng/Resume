53:['Which would be recorded in a partner’s current account? (1) Interest on capital (2) Interest on drawings (3) Share of residual profit (4) New capital introduced',['1, 2 and 3 only','1, 2, 3 and 4','1 and 2 only','3 and 4 only'],0],
54:['Which TWO of the following are reasons for extracting a trial balance?',['To ensure all transactions are in the correct ledger account','To ensure all transactions have been recorded in the books of prime entry','To summarise the ledger account balances','To ensure double entry has been maintained'],[2,3],'m'],
55:['In an extended trial balance the debit column of the statement of profit or loss section adds up to $112,000. The credit column adds up to $111,100. What does this mean?',['There is a cash balance of $900','The difference of $900 should be investigated; the two columns should always agree','A profit of $900 has been made','A loss of $900 has been made'],3],
57:['Which column in the extended trial balance would the following be extended to?',['Bank overdraft','Opening inventory','Insurance expense','Prepayments'],[1,0,0,1],'t',['Statement of profit or loss','Statement of financial position']],
58:['Which TWO of the following would be recorded in the journal?',['Discount allowed','Cash received','Correction of errors','Depreciation charge'],[2,3],'m'],
59:['At the beginning of the month Rob had a debit balance on his cash account of $1,240. He received cash of $300 from credit customers, made cash sales of $550 and spent $475 in cash on materials. What figure should be in his trial balance for the cash account?',[],1615,'n'],
60:['Sarah has decided to increase her receivables allowance. What entries should she make in her general ledger?',['Dr Receivables allowance; Cr Receivables expense','Dr Receivables allowance; Cr Receivables control','Dr Receivables control; Cr Receivables allowance','Dr Receivables expense; Cr Receivables allowance'],3],
61:['At the end of the year, Tank has not received his telephone bill relating to the last quarter. Will each be debited or credited to record this outstanding bill?',['Telephone','Accruals'],[0,1],'t',['Debit','Credit']],
62:['Are the following statements about inventory true or false?',['(i) Closing inventory is a debit to cost of sales','(ii) Inventory appears in the statement of financial position as a current liability'],[1,1],'t',['TRUE','FALSE']],
63:['Which TWO of the account balances would appear on the credit side of a trial balance?',['Purchases','Prepayments','Capital','Carriage inwards','Carriage outwards','Bank overdraft'],[2,5],'m'],
64:['Which are TRUE in relation to sales tax? (1) A registered entity collects the sales tax on behalf of the tax authority (2) Sales tax is borne by the final consumer (3) A registered entity cannot reclaim the sales tax on its purchases and expenses (4) All entities must charge sales tax on their output',['1 and 2 only','1, 2 and 3 only','1, 2, 3 and 4','2 and 4 only'],0],

69:['A trainee has prepared the following payables control account: Cash paid to suppliers $13,860; Purchases day book total $31,540; Contra with receivables control account $500; b/d $17,000. The list of balances from the payables ledger has been agreed with all suppliers, but does not reconcile to the payables control account. Which adjustment will correct the error?',['Record the contra with the receivables control account on the debit side of the account','Record the cash paid to suppliers on the credit side of the account','Include cash purchases from the cash book','Record the b/d balance on the debit side of the account'],0],

PAPERS[4]={t:"Part 4: Examiner's Report MCQs (2023–2026)",q:[]};PAPERS[5]={t:"Part 5: ACCA FA2 Examination Questions",q:[]};NUM[4]=[];NUM[5]=[];X[4]={1:["On which side of the relevant general ledger account will the 'carry forward balances' of (1) a bank overdraft and (2) accumulated depreciation be shown when closing off the accounts at the year end?", ["Both on the credit side", "Both on the debit side", "(1) debit, (2) credit", "(1) credit, (2) debit"], 1],2:["Emma has the following at 31 December 20X1: balance per bank general ledger account $2,358 Dr; bank charges not recorded $35; direct debits not recorded $240; automated receipts not recorded $750; unpresented cheques $3,000; receipts not yet credited by the bank $580. What is the correct reconciled bank balance?", ["$2,833", "$3,383", "$1,333", "$413"], 0],3:["In relation to partnerships, which statements are correct? (1) The personal liability of each partner is not limited to the capital they have invested. (2) The partnership must have a written partnership agreement. (3) All partners must participate in the day-to-day running. (4) Partners are jointly liable for the debts and obligations of the partnership.", ["1 and 2", "1 and 4", "2 and 3", "3 and 4"], 1],4:["Fiona charged depreciation at 30% reducing balance on motor vehicles costing $65,000 (previous depreciation $19,500) and sold plant with accumulated depreciation of $4,000. The brought forward accumulated depreciation was $36,000. What is the closing accumulated depreciation balance?", ["$45,650", "$49,650", "$51,500", "$55,500"], 0],5:["Naima's system auto-generates a suspense entry for imbalanced journals. Errors: (1) an accrual of $450 entered as $540; (2) a cash receipt of $560 from a credit customer recorded as a cash sale. Which statement is correct? (i) The transposition error will not be discovered through producing a trial balance. (ii) The cash receipt treated as a sale will lead to credits exceeding debits in the trial balance.", ["(i) only", "(ii) only", "Both (i) and (ii)", "Neither (i) nor (ii)"], 3],6:["Which of the following statements is/are true about using a cloud-based accounting system? (1) Backups must be taken regularly and held off site in fireproof storage. (2) Passwords should be regularly changed and not written down.", ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"], 1],7:["Which of the following statements about partnerships is/are true? (1) A new partner will always be required to introduce cash on admission. (2) Goodwill is the value of the tangible assets of the partnership at the date of admission of a new partner.", ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"], 3],8:["Seema asks why so many general ledger account codes are needed. Which statements correctly explain this? (1) To allow management to understand the different costs and income of a business. (2) To allow management to understand the different assets and liabilities of a business. (3) To keep a record of what they owe individual suppliers and customers.", ["1, 2 and 3", "1 and 2 only", "3 only", "1 and 3 only"], 1],9:["Luis recognised a cash sale of $40,000 by manual journal but (1) debited sales and credited bank, and (2) recorded both amounts as $30,000. By what amount will profit increase after correction?", ["$10,000", "$40,000", "$70,000", "$80,000"], 2],10:["Which TWO statements about accounting records are true? (1) Total sales for the period can be calculated using the sales returns general ledger account only. (2) The bank general ledger account includes payments made to suppliers. (3) The trade payables general ledger account contains a summary of each supplier's individual balances. (4) A non-current asset register includes a description of each asset, its cost and accumulated depreciation.", ["1 and 2", "2 and 4", "3 and 4", "1 and 3"], 1],11:["A trade receivable balance written off in the previous financial year has now been recovered. What is the effect of the recovery?", ["The receivables allowance will decrease", "The receivables balance will increase", "The capital balance will increase", "Sales revenue will increase"], 2],12:["A business has a 31 March year end but inventory was valued on 8 April. Movements 1-8 April: purchases $14,000; purchase returns $3,000; sales $8,000. Gross profit is 20% of sales. Inventory at cost on 8 April was $44,000. What was the cost of inventory at 31 March?", ["$39,400", "$41,000", "$48,600", "$26,600"], 0],13:["Naima and Burton share profits 2:1. Alan joins and the new ratio is 5:3:2. Goodwill of $360,000 is not carried into the new partnership. Which statements are true? (A) Burton's capital account will decrease due to the goodwill entries. (B) Alan will pay $72,000 for his share of goodwill. (C) $108,000 will be debited to Burton's capital account for goodwill. (D) $180,000 will be credited to Naima's capital account for goodwill.", ["A and B", "B and C", "C and D", "A and D"], 1],14:["Clara runs an online business selling catering equipment. Which of the following would be used to identify the point at which a sale is recognised?", ["Bank payment received from a customer", "Quote issued to a customer", "Delivery note signed by customer", "Purchase order received from customer"], 2],15:["Swift Co has a 31 March year end. Motor insurance of $7,200 (annual, expires 31 May 20X9) and buildings insurance of $30,000 (annual, expires 30 November 20X9) were each paid in full on the first day of the policy. What amount should be shown as prepaid insurance at 31 March 20X9?", ["$21,200", "$20,000", "$1,200", "$28,800"], 0],16:["Swallow Co's trade receivables increased by $600,000 during the year. Total sales were $12 million, of which 25% were cash sales. No discounts were allowed and no irrecoverable debts were written off. How much was received from credit customers?", ["$8.4m", "$9.6m", "$11.4m", "$12.6m"], 0],17:["Blackbird Co found that advertising expenses were incorrectly included in cost of sales. What is the effect on gross profit and profit for the year of correcting this?", ["Increase gross profit, decrease profit for the year", "Increase gross profit, no effect on profit for the year", "Decrease gross profit, increase profit for the year", "Decrease gross profit, no effect on profit for the year"], 1],18:["Hawk Co's supplier statement shows $8,710; Falcon Co's ledger balance for Hawk is $8,400. (1) A settlement discount of $40 has not been recognised by Falcon. (2) An invoice of $1,900 appears on the statement as $1,090. (3) A payment of $160 made on 28 December is not on the statement. (4) An invoice of $1,000 on the statement is omitted from Falcon's ledger. What is Hawk Co's reconciled trade payables balance?", ["$9,360", "$9,400", "$8,360", "$9,520"], 0]};X[5]={1:["Sybil's financial year ended on 30 November 20X2. She incurs the same telephone expense each month. The last invoice in respect of telephone expenses totalled $1,800. This invoice covered the three months to 31 October 20X2. What adjustment is required in respect of telephone expenses when preparing the accounts for the year to 30 November 20X2?", ["A prepayment of $1,200", "An accrual of $1,200", "A prepayment of $600", "An accrual of $600"], 3],2:["Which of the following accounting principles is most relevant in relation to the requirements of IAS 16 Property, Plant and Equipment in the following situations?", ["Classifying property as a non-current asset", "Depreciating property, plant and equipment"], [1, 0], "t", ["Accrual accounting", "Going concern"]],3:["Norman is entering information into the non-current asset register. Which TWO of the following pieces of information will be used when carrying out a verification of the physical presence of non-current assets?", ["Supplier", "Location", "Description", "Cost"], [1, 2], "m"],4:["John has been asked to provide a copy of his final accounts to his bank manager. What is the bank manager MOST likely to use the final accounts for?", ["To calculate the tax payable on John's business profit", "To ensure that the business is able to make repayments on a loan", "To ensure that John's profit margin is as good as the margin earned by other bank customers", "To ensure that the profit is sufficient to provide a good income for John"], 1],5:["In preparing the financial statements, it was discovered that an asset purchased for $10,000 in the last month of the accounting period had been debited to repairs in error. Depreciation is charged at 15% per annum on a monthly pro-rata basis. Are the following statements relating to the correction of the error true or false?", ["The error would need to be corrected before the financial statements were finalised", "The correction will decrease the profit for the year"], [0, 1], "t", ["True", "False"]],6:["Which of the following statements correctly describes the dual aspect convention of accounting?", ["Transactions are recorded in both the general ledger and in a separate detailed listing", "If a transaction requires two debit entries, two credit entries must also be made", "Only two general ledger accounts will be needed to record any transaction", "A change in the value of assets leads to an equal change in the value of liabilities plus capital"], 3],7:["Janet valued her inventory at 30 June 20X5 at its cost of $22,960. This includes some items which cost $1,950 which have been difficult to sell. Janet intends to have these items repackaged at a cost of $400. She can then sell them for $900. What will be the value of closing inventory in Janet's accounts at 30 June 20X5?", [], 21510, "n"],8:["A business has cash of $1,100, trade payables of $2,500, a loan liability of $8,000 and land of $16,000. What is the capital balance?", ["$10,500", "$27,600", "$6,600", "$16,000"], 2],9:["Adele runs a restaurant. In August 20X3 she received a letter from a lawyer representing a customer who claimed he suffered food poisoning after eating in the restaurant. The customer is claiming damages of $3,000. Adele offered to pay $300. Her lawyer's advice is that the case is likely to go to court and Adele is likely to be required to pay $1,500. The lawyer also advised that the court case is unlikely to take place before April 20X4. What amount should be provided for in respect of the claim in Adele's final accounts for the year ended 30 September 20X3?", ["$1,500", "$300", "$nil", "$3,000"], 0],10:["Ruth started trading a year ago. She sells her products at a mark-up of 30%. In the first year of trading, she bought goods for $25,800. Her sales in the year were $30,888. What is the value of Ruth's closing inventory?", [], 2040, "n"],11:["Fiona received a statement of account from a supplier, Raj, showing a balance outstanding to Raj of $15,400 at 31 December 20X8. Fiona's accounting system shows a balance outstanding to Raj of $16,200 at 31 December 20X8. From Fiona's accounting perspective, which TWO of the following statements could explain the difference?", ["Fiona had recorded a payment to a different supplier and allocated it incorrectly to Raj's account in Fiona's accounting system", "Raj had given Fiona a credit note for goods returned which had been omitted from Raj's supplier account in Fiona's accounting system", "Fiona had made a payment to Raj before the year end and which had not been reflected on the statement of account", "Fiona had recorded a purchase invoice from Raj in Raj's supplier account in Fiona's accounting system twice"], [1, 3], "m"],12:["Ari is registered for sales tax and he has purchased goods for resale. The invoice shows the cost of goods as $357.50, which includes sales tax at 10%. What amount should be debited to the purchases account?", ["$357.50", "$393.25", "$325.00", "$321.75"], 2],13:["At 1 September 20X1, the balance on Hai's capital account was $31,754. In the year to 31 August 20X2, he invested an additional $40,000 of personal funds and took a bank loan of $80,000 for the business. The statement of profit or loss for the year to 31 August 20X2 reported a profit of $48,634 and Hai's drawings during the year were $28,500. What is Hai's closing capital at 31 August 20X2?", [], 91888, "n"],14:["When Frank prepared his year end accounts, he made a calculation error and overstated the value of his closing inventory. What is the effect of this error on the profit for the year and the net assets at the year end?", ["Profit for the year", "Net assets at year end"], [1, 1], "t", ["Understated", "Overstated"]],15:["John needs to adjust his draft year-end accounts to record a prepayment of $1,500 and an accrual of $400. How will John's profit and net assets be affected by including the prepayment and the accrual?", ["Profit will increase by $1,100 | Net assets will increase by $1,100", "Profit will reduce by $1,900 | Net assets will reduce by $1,900", "Profit will reduce by $1,900 | Net assets will increase by $1,900", "Profit will increase by $1,100 | Net assets will decrease by $1,100"], 0],16:["One of Brian's customers returned goods valued at $670. These had been sold on credit. What double entry should Brian post to record the return of the goods?", ["Dr Sales returns $670 | Cr Trade receivables $670", "Dr Trade receivables $670 | Cr Bank $670", "Dr Bank $670 | Cr Trade receivables $670", "Dr Trade receivables $670 | Cr Sales returns $670"], 0],17:["Michael and Donald have been in partnership for several years, sharing profits and losses in the ratio 3:4. At 1 January they had the following credit balances: Michael – capital $65,000, current $11,486; Donald – capital $80,000, current $9,637. The partnership statement of profit or loss for the year to 31 December shows a net profit of $28,595 and the partners have made drawings of $16,500 each. What is the balance on Michael's current account at 31 December?", [], 7241, "n"],18:["At 1 October 20X1, Bakari's bank overdraft was $3,270. During the year to 30 September 20X2, he made electronic bank transfers with a total value of $189,642. His total lodgements during the year were $191,729. In addition, bank charges of $827 were incurred. What is Bakari's bank balance carried forward at 30 September 20X2 as per his accounting records?", ["$4,530 debit", "$6,184 debit", "$2,010 credit", "$356 debit"], 2],19:["Which of the following items would be included in the statement of financial position and which in the statement of profit or loss?", ["Cost of sales", "Capital", "Provisions", "Depreciation expense"], [1, 0, 0, 1], "t", ["Statement of financial position", "Statement of profit or loss"]],20:["Desmond is registered for sales tax. The tax rate is 17.5%. Quarter ended 31 March 20X3 (including sales tax): Sales – Jan $5,875, Feb $8,225, Mar $7,050. Purchases – Jan $3,525, Feb $4,700, Mar $5,875. The balance on the sales tax account at 1 January 20X3 was nil. What is the balance on the sales tax account at 31 March 20X3?", ["$1,050 due to tax authority", "$1,233.75 due from tax authority", "$1,050 due from tax authority", "$1,233.75 due to tax authority"], 0],21:["Riley has been trading as a retailer of shoes for many years. During the current year, Riley required more funds to expand his business so paid $20,000 into his business bank account from his personal savings. Which TWO of the following would be the dual effect of the above transaction for Riley's business?", ["Decrease in capital", "Increase in capital", "Increase in assets", "Decrease in assets"], [1, 2], "m"],22:["At 1 January 20X3 Wasan had 250 units of inventory valued at $155 each. During January: purchases – 10 January 140 units at $158; 22 January 110 units at $160. Sales – 5 January 175 units; 17 January 130 units; 28 January 105 units. Wasan values inventory using average cost (AVCO) on the periodic weighted average basis. What is the value of Wasan's inventory at 31 January 20X3 (to the nearest $1)?", ["$14,280", "$14,125", "$14,299", "$14,400"], 1],23:["Margaret compared her bank statement with the bank general ledger account and found they did not agree. She found two possible causes for the difference. Do these reasons for the difference require an entry in the bank general ledger account?", ["Some cheques have not been lodged by her suppliers", "The bank debited fees on her account"], [1, 0], "t", ["Yes", "No"]],24:["Alex and Jose are in partnership. Alex is entitled to a salary of $11,000 per year. In the year to 31 December 20X1, the net profit was $43,877. Interest on capital: Alex $8,000, Jose $9,500. Interest on drawings: Alex $3,500, Jose $5,400. What is the residual profit for the year to 31 December 20X1?", [], 24277, "n"],25:["Which of the following statements regarding inventory valuation is correct?", ["The purchase price of items which have been held for the longest period is an acceptable method for valuing inventory", "All items held in inventory should be valued at cost", "Inventory valuation should exclude profit that has not yet been earned", "Inventory should be valued at anticipated selling price less any cost which will be incurred"], 2],26:["What is the purpose of charging depreciation?", ["To reflect the fair value of the asset in the statement of financial position", "To ensure that funds are available for the eventual replacement of the non-current asset", "To reflect the falling realisable value of an asset", "To allocate the cost of a non-current asset over the accounting periods expected to benefit from its use"], 3],27:["Samantha has prepared the following bank reconciliation statement at 31 March: Balance on bank statement $1,250 (overdrawn); Unpresented cheques $748; Outstanding lodgement $2,200; Balance on general ledger account $202 (debit). How should the bank balance be reported in Samantha's statement of financial position at 31 March?", ["$202 as a current liability", "$1,250 as a current asset", "$202 as a current asset", "$1,250 as a current liability"], 2],28:["At the start of the year, the balance on Toni's capital account was $35,869. During the year Toni made drawings of $17,800 and the net profit for the year was $18,700. What is Toni's closing capital at the end of the year?", [], 36769, "n"],29:["At 30 November, Charles is owed a total of $72,660 by his customers. His allowance for irrecoverable debts brought forward is $11,700. He estimates that his allowance for the current year should be equivalent to 15% of the amounts due from customers. What amount should be included in the statement of profit or loss for the irrecoverable debts expense for the year to 30 November?", ["$801 credit", "$10,899 credit", "$801 debit", "$10,899 debit"], 0],30:["Sarah's bank general ledger account at 30 April 20X4 shows a debit balance of $2,280. Comparison with the bank statement reveals: uncleared electronic payments $780; bank charges not in the bank general ledger account $40; receipts not yet credited by the bank $450; dishonoured cheque not in the bank general ledger account $120. What is the reconciled bank general ledger account balance at 30 April 20X4?", ["$1,340", "$2,120", "$1,950", "$2,360"], 1],31:["Maura and Delia have been in partnership sharing profits and losses equally. At 1 March 20X1 the total value of the balances on their capital and current accounts was $225,000. At that date Delia was admitted to the partnership and it was agreed that: (1) the partners would share profits and losses equally; (2) goodwill would be valued at $75,000; (3) goodwill would not be maintained in the books; (4) Delia would introduce cash to ensure that her opening capital balance is nil. How much cash must Delia contribute?", ["$25,000", "$75,000", "$37,500", "$12,500"], 2],32:["How should prompt payment discounts be treated where a customer unexpectedly takes advantage of the discount?", ["As an expense deducted from gross profit", "As an expense included in cost of sales", "As a deduction from the value of discount received", "As a deduction from the value of sales"], 3],33:["Jessie's trial balance at 30 September 20X0 included: trade receivables $90,350 (Dr); allowance for irrecoverable debts brought forward $2,490 (Cr). (1) No entries have been made in respect of cash of $1,320 received from Jeffrey whose balance had been written off last year. (2) At 30 September 20X0 an irrecoverable balance of $1,950 is to be written off and the allowance is to be adjusted to 1.5% of the remaining balances. What figure will be reported in the statement of financial position at 30 September for trade receivables?", [], 87074, "n"],34:["In finalising the financial statements for the year ended 30 September 20X9, it was discovered that an invoice of $1,380 which was received on 12 November 20X9 in respect of insurance for the six months ended 31 October 20X9 had not been accounted for. Which of the following journal entries are required to account for the invoice received?", ["Dr Prepayments $230 | Cr Insurance expenses $230", "Dr Insurance expenses $1,380 | Cr Accruals $1,380", "Dr Prepayments $1,380 | Cr Insurance expenses $1,380", "Dr Insurance expenses $1,150 | Cr Accruals $1,150"], 3],35:["Alan purchased a machine on 1 March 20X1 for $12,000. He incurred additional costs for transportation of $1,300 and installation of $2,000. Shortly after he started to use the machine, it broke down and the repair of the machine cost $600. Alan charges depreciation at 10% per year on a straight-line basis with a full year's charge in the year of acquisition. What is the correct carrying amount of the machine at the year end date of 31 December 20X1?", ["$15,300", "$10,800", "$13,770", "$14,310"], 2],36:["Luis and David are in partnership sharing profits and losses in the ratio 3:2. David is entitled to a salary of $9,000 and interest on capital is paid at a rate of 8% per year. The partners' capital balances are: Luis $75,000; David $60,000. The partnership statement of profit or loss for the year shows a profit of $58,500. How much of the total profit is Luis entitled to?", [], 29220, "n"],37:["Which of the following correctly states the accounting equation?", ["Capital minus liabilities equals assets", "Assets plus capital equals liabilities", "Capital plus liabilities equals assets", "Assets plus liabilities equals capital"], 2],38:["Fred purchased a new van. The new van cost $9,000 and Fred paid a cheque for $2,500 to the dealer. In addition the dealer accepted an old van in part exchange. The old van had been bought three years ago for $11,600 and had been depreciated by $6,750. What is the gain or loss on disposal of the old van?", ["$6,500 loss", "$6,500 gain", "$1,650 gain", "$1,650 loss"], 2],39:["Lance is registered for sales tax and is entering a purchase invoice into the accounting system. The invoice shows: water treatment equipment $39,800; delivery $1,100; maintenance charge $3,980; sales tax $7,854; invoice total $52,734. What is the total value of asset expenditure on the invoice?", ["$52,734", "$44,880", "$39,800", "$40,900"], 3],40:["The computerised accounting system has produced a report showing year-end manual adjustments (extracts): Rent and rates – trial balance $18,000, adjustment $3,000 (prepayment); Stationery – trial balance $3,000, adjustment $1,200 (prepayment). Which TWO of the following statements are correct?", ["Rent and rates will be shown in the statement of profit or loss as an expense of $15,000", "Stationery will be shown in the statement of profit or loss as an expense of $1,800", "Rent and rates will be shown in the statement of profit or loss as an expense of $21,000", "Stationery will be shown in the statement of profit or loss as an expense of $4,200"], [0, 1], "m"],41:["Nandita has bought goods for resale on credit from Pascale. Nandita is not registered for sales tax. When the transaction is posted to the general ledger, which TWO of the following entries should be included?", ["Cr Bank", "Dr Purchases", "Dr Sales tax", "Cr Trade payables"], [1, 3], "m"],42:["At 30 September 20X3 Pamela's inventories were valued at $6,400. Trial balance: Sales $45,000 (Cr); Purchases $29,500; Inventories at 1 October 20X2 $5,700; Delivery cost on purchases $750; Distribution costs $340; Wages $6,000; Advertising $1,900; Other expenses $2,500. What is Pamela's gross profit for the year to 30 September 20X3?", ["$15,450", "$16,200", "$4,710", "$15,110"], 0],43:["Which of the following best describes a statement of profit or loss?", ["It is a statement that shows the financial performance of a business for an accounting period", "It is a statement that presents all the ledger account balances", "It is a statement that shows the cash inflows or outflows of a business for an accounting period", "It is a statement that shows a business's financial position at a point in time"], 0],44:["Consider the following statements about going concern: (1) Financial statements must always be prepared on the going concern basis. (2) If a business is not considered to be a going concern, financial statements should not be prepared. Which of the statement(s) is/are correct?", ["Neither 1 nor 2", "2 only", "1 only", "Both 1 and 2"], 0],45:["At 30 November 20X3, Zoltan's bank account was overdrawn. He also had a bank loan on which monthly repayments of the principle will commence in February 20X5. How should these balances be reported on Zoltan's statement of financial position at 30 November 20X3?", ["Bank current account", "Bank loan"], [1, 2], "t", ["Current asset", "Current liability", "Non-current liability"]],46:["James has been advised that one of his customers has ceased trading and that he will not recover the balance of $720 owed by this customer. What entry should James make in his general ledger?", ["Dr Trade receivables $720 | Cr Bank $720", "Dr Irrecoverable debt expense $720 | Cr Trade receivables $720", "Dr Trade receivables $720 | Cr Irrecoverable debt expense $720", "Dr Bank $720 | Cr Trade receivables $720"], 1],47:["Identify whether the following costs should be included in the cost of inventories in accordance with IAS 2 Inventories:", ["General administrative overheads", "Transport costs of imported raw materials", "Storage costs of finished goods", "Selling costs"], [1, 0, 1, 1], "t", ["Should be included", "Should NOT be included"]],48:["The amount owed to Jane by her customers at 31 October 20X2 was $34,729. A year earlier she was owed $27,641. During the year Jane had deposited $327,684 into her bank account. This included payments received from her credit customers as well as $45,000 which Jane had received from the sale of her holiday home. What was the value of Jane's credit sales for the year to 31 October 20X2?", ["$282,684", "$327,684", "$334,772", "$289,772"], 3],49:["Juan and Bilal are in partnership sharing profits in the ratio 2:3 respectively. The partnership statement of profit or loss reported a net profit for the year of $115,000. Juan is to receive a salary of $10,000 per annum and Bilal is to receive a salary of $20,000 per annum. What is Juan's total share of the profit of $115,000?", [], 44000, "n"],50:["Which accounting principle is applied when two similar transactions are treated in the same way?", ["Materiality", "Consistency", "Accruals", "Duality"], 1]};
PAPERS[6]={t:"Part 6: Mock Exam 1",q:[]};NUM[6]=[];X[6]={1:["When carrying out a reconciliation between the non-current assets in her asset register and the assets which she can physically identify, Wilma could not find one of the assets which is recorded in her asset register. Could each of the following reasons explain the discrepancy?", ["No record was made when the asset was sold", "The supplier's invoice has not yet been received"], [0, 1], "t", ["Yes", "No"]],2:["Jerome's trade receivables general ledger account has a balance of $57,840. He has decided to write off an irrecoverable debt of $320. His allowance for irrecoverable debts at the last year end was $1,368. He has calculated that this should be revised to $1,247. What is the resulting charge to Jerome's statement of profit or loss?", [], 199, "n"],3:["'A business should apply the same accounting treatment to similar items from one accounting period to the next.' What accounting principle is described by the statement above?", ["Going concern", "Business entity", "Consistency", "Materiality"], 2],4:["Which of the following statements describes the qualitative characteristic of RELEVANCE?", ["Information which is free from material error", "Information which is unbiased", "Information which is capable of making a difference in the decisions made by users", "Information which can easily be understood"], 2],5:["Since Petra commenced trading the cost of the items she sells has increased. Petra is trying to decide how her profit for the year will be affected by the method she uses to value her inventory. Which TWO of the following statements are CORRECT?", ["First-in first-out will report a lower profit than weighted average", "Weighted average will report a lower profit than first-in first-out", "Profit for the year is affected by the method of inventory valuation", "Petra should value inventory on the basis that reports the lowest profit"], [1, 2], "m"],6:["Are the below statements true or false in relation to the different types of accounting records that a business should maintain?", ["A non-current asset register includes a description of each asset, its cost and accumulated depreciation", "The trade receivables general ledger presents the sum of all customer account balances", "The bank general ledger account includes all cash receipts from customers", "The total purchases for the period can be calculated by deducting the purchase returns general ledger account from the trade payables general ledger account balance"], [0, 0, 0, 1], "t", ["True", "False"]],7:["Which of the following accounting principles is most relevant in relation to the requirements of IAS 2 Inventories in the following situations?", ["Valuing inventories at the lower of cost or net realisable value", "Recognising the costs of goods sold when sales are made"], [1, 0], "t", ["Accrual accounting", "Prudence"]],8:["Elaine is preparing her bank reconciliation and has noted some reconciling items. Do each of these reconciling items require an entry in Elaine's bank general ledger account?", ["A cheque payable to S Wright has not been presented at the bank", "The bank has levied charges on Elaine's account which have not been recorded by Elaine"], [1, 0], "t", ["Yes", "No"]],9:["Bill uses the first-in, first-out (FIFO) method of inventories valuation. At 1 May 20X8, he had 60 units in inventories at a total carrying amount of $1,320. The movement in inventories in May 20X8 was:<br>Purchases: 14 May 120 units at $22.20; 26 May 150 units at $22.30<br>Sales: 18 May 90 units; 28 May 80 units<br>What is the value of Bill's inventories at 31 May 20X8?", [], 3567, "n"],10:["Ethel's trial balance includes: Trade receivables $136,853 Dr; Allowance for irrecoverable debts $14,862 Cr.<br>For these to balance only, what current asset and current liability balances should be reported on Ethel's statement of financial position?", ["Current liability", "Current asset"], [0, 2], "t", ["nil", "$14,862", "$121,991", "$136,853"]],11:["Estelle has prepared the following journal entry: Dr Cash $500; Cr Trade receivables $500.<br>What is the correct narrative for the journal entry?", ["Cash received from a customer", "Cash paid to a supplier", "Cash purchase made", "Cash sale made"], 0],12:["At 31 October 20X6 Gina owed her suppliers $13,856. During the year ended 31 October 20X7 her payments to suppliers totalled $95,886 and at 31 October 20X7 she owed her suppliers $11,552. What is the value of Gina's credit purchases for the year ended 31 October 20X7?", [], 93582, "n"],13:["What should the balance on the trade receivables general ledger account show?", ["The total amount received from customers during the accounting period", "The total amount owed by the business to its suppliers", "The difference between the amount owed to suppliers and owed by customers", "The total amount owed to the business from its customers"], 3],14:["In the year ended 30 November 20X7, Grace charged a 25% markup on all her sales. Her sales for the year totalled $120,600. Her opening inventories were valued at $9,340 and her closing inventories were valued at $11,855. What was the value of Grace's purchases for the year ended 30 November 20X7?", [], 98995, "n"],15:["In the year to 31 May 20X9, Ina's sales were $174,820 and her cost of sales was $139,856. What were her gross profit margin and mark up?", ["Margin", "Mark up"], [0, 1], "t", ["20%", "25%"]],16:["A company has the following general ledger accounts: Trade Receivables - Dr $3,000 (Table and chair sales); Table Sales - Cr $2,250 (Trade receivables); Chair Sales - Cr $750 (Trade receivables).<br>Which of the following accounting entries would result in the amounts shown in these accounts?", ["Dr Table sales $2,250; Dr Chair sales $750; Cr Trade receivables $3,000", "Dr Table sales returns $2,250; Dr Chair sales returns $750; Cr Trade receivables $3,000", "Dr Trade receivables $3,000; Cr Table sales $2,250; Cr Chair sales $750", "Dr Trade receivables $3,000; Cr Table sales $3,000"], 2],17:["Shiloh has the following bank general ledger account:<br>Debit: Opening balance $12,000; Sales $27,000 (total $39,000)<br>Credit: Purchases $12,500; Expenses $11,500; Closing balance $15,000 (total $39,000)<br>What does the $15,000 closing balance represent?<br>(1) The bank balance for inclusion in the trial balance<br>(2) The opening bank balance for the next accounting period<br>(3) The bank balance to be reconciled with supplier statement balances", ["1, 2 and 3", "1 and 3 only", "1 and 2 only", "2 and 3 only"], 2],18:["Which TWO of the following actions should be taken after producing a trial balance to prepare the final accounts?", ["Process manual journal entries for the difference between actual and budgeted sales", "Accrue for any expenses incurred before the year end for which the invoice was received after year end", "Process manual journal entries to correct for any amounts in the suspense account", "Accrue for any expenses incurred after the year end for which the invoice was received in the same period"], [1, 2], "m"],19:["Do each of the following correctly describe why a bank reconciliation is prepared?", ["To identify entries which have been generated by the bank but not recorded in the bank general ledger account", "To identify errors in the entries in the bank general ledger account"], [0, 0], "t", ["Yes", "No"]],20:["Paula and Quentin are in partnership sharing profits equally. On 1 July 20X5, Raj joined the partnership and it was agreed, from that date, all three partners should share in the profit equally. In the year ended 31 December 20X5, the profit amounted to $300,000, accruing evenly over the year. In calculating profit for the year, an irrecoverable debt of $30,000 was written off and it was agreed that this should be borne equally by Paula and Quentin only. What should Paula's total profit share be for the year ended 31 December 20X5?", [], 122500, "n"],21:["Which of the following is the correct journal entry to record a credit note issued to a customer for goods returned?", ["Dr Trade receivables; Cr Sales returns", "Dr Sales returns; Cr Trade receivables", "Dr Cash; Cr Sales returns", "Dr Sales returns; Cr Cash"], 1],22:["During the year ended 31 October 20X9, Claudia: (1) had opening net assets of $127,554; (2) had closing net assets of $174,529; (3) introduced a further $35,000 of capital; (4) took drawings of $17,150. What was Claudia's profit for the year ended 31 October 20X9?", [], 29125, "n"],23:["Which of the following statements best describes current assets?", ["Assets which are currently located on the business premises", "Assets which are expected to be converted into cash in the short term", "Assets which are used to conduct the organisation's current business", "Assets which are not expected to be converted into cash in the short term"], 1],24:["Kirandeep has been working as a sole trader for many years. They decided to remove goods from the business for their own personal use. Which of the following is the correct manual journal entry to recognise this transaction in Kirandeep's general ledger?", ["Dr Capital; Cr Inventories", "Dr Drawings; Cr Inventories", "Dr Inventories; Cr Capital", "Dr Inventories; Cr Drawings"], 1],25:["Ali is registered for sales tax and the tax rate is 20%. For the quarter ended 31 March 20X8: (1) there was an opening sales tax balance of $230 on 1 January 20X8, paid promptly on 10 January 20X8; (2) sales, including sales tax, were $26,820; (3) purchases, excluding sales tax, were $18,600. What amount is owed by Ali to the tax authority at 31 March 20X8?", [], 750, "n"],26:["Bill obtains a 25% margin on all his sales. In the year to 31 March 20X0 he bought goods with a total value of $69,000. His closing inventory cost $3,000 less than his opening inventory. What is the value of Bill's sales in the year to 31 March 20X0?", [], 96000, "n"],27:["Are the following statements relating to the first-in, first-out (FIFO) method of valuing inventories true or false?", ["The value of the inventory on the statement of financial position will be the value of the most recent units purchased", "Using the FIFO method guarantees that inventories are valued at the lower of cost and net realisable value"], [0, 1], "t", ["True", "False"]],28:["James and Claude are in partnership sharing profit in the ratio 3:2 respectively. On 1 June 20X7, they decide to admit Ramon as a partner and change the profit sharing ratio to 3:2:1 for James, Claude and Ramon respectively. Capital accounts on 1 June 20X7: James $68,000 Cr; Claude $52,000 Cr. The goodwill of the partnership has been valued at $36,000. Ramon pays $14,000 into the partnership. This includes $6,000 for his share of goodwill. Goodwill is not maintained in the partnership. What is James' capital balance immediately after Ramon has been admitted as a partner?", ["$64,400", "$68,000", "$71,600", "$89,600"], 2],29:["Kendall commenced their sole trade on 1 August 20X5. On that date, they introduced capital of $10,000. Kendall made a profit of $2,500 for the year ended 31 July 20X6 and took no drawings. During the year ended 31 July 20X7, Kendall withdrew $4,000 from the business bank account for personal use. The loss for the year ended 31 July 20X7 was $1,200. What is the total amount recognised as overall capital on Kendall's statement of financial position as at 31 July 20X7?", [], 7300, "n"],30:["Which of the following statements is CORRECT?", ["An accrued expense is recorded when the payment is made", "Accrued expenses increase the value of liabilities", "A prepayment arises when an expense is incurred before it is paid", "Prepaid expenses reduce the value of assets"], 1],31:["Gayle paid for office cleaning in cash. She processed the following manual journal entry to recognise this: Dr Trade payables; Cr Office cleaning expenses. Which general ledger accounts require an entry to correct this?", ["Office cleaning expenses, cash and trade payables", "Cash and trade payables only", "Office cleaning expenses and trade payables only", "Office cleaning expenses and cash only"], 0],32:["In which of the following circumstances would an entry be made in the non-current asset register? (1) When an asset is traded-in (2) When an asset is scrapped", ["Both 1 and 2", "Neither 1 nor 2", "1 only", "2 only"], 0],33:["What journal entry is processed by the computerised accounting system when a credit sales invoice is raised in the sales system (ignore tax)?", ["Dr Trade receivables; Cr Sales", "Dr Sales; Cr Cash", "Dr Cash; Cr Sales", "Dr Sales; Cr Trade receivables"], 0],34:["Isa reconciled their trade payables general ledger account balance with the sum of all individual supplier statement balances. The following issues have been identified:<br>(1) Supplier invoices totalling $2,300 have been omitted from Isa's accounting system<br>(2) Supplier invoices totalling $480 have been input twice, in error, to Isa's accounting system<br>(3) Credit notes incorrectly issued by the supplier totalling $1,000 are included in the supplier statements but are omitted from Isa's accounting system All purchases and purchase returns are recognised in the same general ledger account in Isa's accounting system.<br>Which of the following manual journal entries will correct Isa's ledger accounts for the cumulative errors above?", ["Dr Purchases 820; Cr Trade payables 820", "Dr Trade payables 820; Cr Purchases 820", "Dr Purchases 1,820; Cr Trade payables 1,820", "Dr Trade payables 1,820; Cr Purchases 1,820"], 2],35:["Ilhan performed supplier statement reconciliations for all accounts on the detailed listing of supplier balances at 31 December 20X9. The trade payables general ledger account shows a balance of $45,620 at that date and the following reconciling items were identified:<br>(1) A supplier invoice totalling $980 was incorrectly input to the purchases module of the computerised accounting system as $890<br>(2) Supplier invoices received during the financial year which were not input to the purchases module totalled $4,500<br>(3) Manual journal entries processed on 31 December 20X9 by Ilhan for supplier payments totalled $6,400 but have not been recognised by the individual suppliers What balance should be presented for trade payables on the statement of financial position as at 31 December 20X9?", [], 50210, "n"],36:["On 1 January 20X8, Paul purchased plant and equipment costing $90,000. Paul's depreciation policy is to use a straight line basis over 10 years assuming a nil residual value. What will be the effect on Paul's profit and net assets for the year ended 31 December 20X8 if he changes his depreciation policy to the reducing balance basis at 30% per annum from 1 January 20X8?", ["Profit will decrease by $18,000 and net assets will decrease by $18,000", "Profit will decrease by $18,000 and net assets will increase by $18,000", "Profit will increase by $18,000 and net assets will decrease by $18,000", "Profit will increase by $9,000 and net assets will increase by $9,000"], 0],37:["Mikel has been contacted by a customer because a part he supplied has damaged one of the customer's machines. The customer has asked Mikel to pay costs of $5,500. Mikel's offer to pay $3,000 has been refused by the customer leading to legal action. Mikel's solicitor has told him that the court case will not take place until late 20X1 and that it is most likely that he will be required to pay $4,000. What provision should Mikel make in his statement of financial position at 20 April 20X0?", ["nil", "$3,000", "$5,500", "$4,000"], 3],38:["Brogan received a statement of account from a supplier, Shannon, showing a balance outstanding of $30,800 at 31 March 20X3. Brogan's detailed listing of supplier accounts shows a balance outstanding to Shannon of $32,400. From Brogan's perspective, which TWO of the following statements could explain the difference?", ["Brogan input a $1,600 purchase invoice from Shannon to the purchases module twice", "Brogan allocated a $1,600 payment to Shannon's individual balance when it related to a different supplier", "Shannon issued Brogan a $1,600 credit note for goods returned which had been omitted from Brogan's accounting system", "Brogan made a $1,600 payment to Shannon before the year end which had not been reflected on Shannon's statement of account"], [0, 2], "m"],39:["Tony returned items of office stationery to his supplier and his supplier sent him a credit note. What journal entry does the computerised accounting system recognise when a credit note is entered in the purchases system?", ["Dr Goods for resale - returns; Cr Trade payables", "Dr Trade payables; Cr Goods for resale - returns", "Dr Office stationery; Cr Trade payables", "Dr Trade payables; Cr Office stationery"], 3],40:["Isra started a sole trader business during the year and operates basic computerised accounting software. The software automatically creates a suspense account when a manual journal entry is imbalanced. Each type of expense has its own general ledger account. The following errors have been identified by Isra:<br>(1) Additional cash invested by Isra was coded to sales instead of capital in the general ledger<br>(2) Isra has not processed the manual journal entry for the year's depreciation (3) Isra posted a manual journal entry for heat and light expense against the incorrect expense account<br>(4) Isra processed a manual journal entry with a debit of $560 to prepayments but only credited expenses with $506<br>Which of the above errors would be detected by extracting a trial balance?", ["1 and 2 only", "1 and 3", "2 and 4 only", "1, 2 and 4"], 2],41:["Vikki is preparing her final accounts for the year ended 31 October 20X8. The most recent invoice in her records for electricity was a charge of $1,647 for the three months to 31 August 20X8. What post trial balance adjustment should Vikki make?", ["$549 accrual", "$549 prepayment", "$1,098 prepayment", "$1,098 accrual"], 3],42:["On 23 May 20X7, Julie used a cheque to pay the insurance on her business premises for the three months to 31 August 20X7, in advance. She immediately made a manual adjustment to account for this prepayment. On 23 May 20X7, how is Julie's accounting equation affected by this transaction?", ["Assets unchanged; Liabilities unchanged; Capital unchanged", "Assets unchanged; Liabilities reduced; Capital reduced", "Assets reduced; Liabilities unchanged; Capital unchanged", "Assets reduced; Liabilities unchanged; Capital reduced"], 0],43:["Which of the following items should be included in the calculation of the net profit for a partnership? (1) Interest on a loan from a partner (2) Salaries for employees (3) Salaries for partners", ["2 and 3 only", "1, 2 and 3", "1 and 2 only", "1 and 3 only"], 2],44:["During the year ended 30 April 20X8, Trevor wrote off an irrecoverable debt of $563. If in the year to 30 April 20X9 Trevor receives the $563 which was written off how will his financial statements for that year be affected by the receipt?", ["His receivables balance will be reduced by $563", "His receivables balance will be increased by $563", "His profit will be reduced by $563", "His profit will be increased by $563"], 3],45:["Which of the following statements is CORRECT?", ["All the information needs of the owner are met by the financial statements", "Financial statements of a sole trader must be prepared by a qualified accountant", "Financial statements are intended to provide useful information to a number of user groups", "Financial statements do not provide useful information to lenders"], 2],46:["Chimwe purchased a new non-current asset, and paid for this through an electronic bank transfer. At the same time, a bank loan was raised to provide some of the funds needed for the purchase. What entry correctly records the purchase of the non-current asset?", ["Dr Non-current assets; Cr Bank", "Dr Non-current assets; Cr Loan payable", "Dr Bank; Cr Non-current assets", "Dr Loan payable; Cr Non-current assets"], 0],47:["Casey has processed a manual journal entry to recognise accruals correctly. What is the debit or credit impact on the financial statements from this manual journal entry?", ["Statement of financial position", "Statement of profit or loss"], [1, 0], "t", ["Debit", "Credit"]],48:["Alec and Carl are in partnership sharing profits and losses in the ratio 3:2. The statement of profit or loss for the year ended 31 October 20X8 reports a profit of $98,500. Interest on capital has been calculated as: Alec $7,900; Carl $5,100. Both capital and current accounts are maintained. Neither partner made any drawings in the year. What is the increase in the balance on Carl's current account in the year to 31 October 20X8?", [], 39300, "n"],49:["Rosario sold goods to Dino on credit. Two weeks later Dino returned the goods. What general ledger entry should Rosario make to record the return of the goods?", ["Dr Trade payables; Cr Purchase returns", "Dr Purchase returns; Cr Trade payables", "Dr Sales returns; Cr Trade receivables", "Dr Trade receivables; Cr Sales returns"], 2],50:["The bank account in Trish's general ledger has a credit balance of $358. The difference between this balance and the balance on her bank statement is due to: (1) Trish incorrectly recording the value of a cheque paid to a supplier for $245 as $254; (2) A lodgement of $283 that has still to be credited by the bank; (3) The bank charging interest of $104 on her overdraft. After correcting the bank account in Trish's general ledger, which of the above items should appear as an adjustment on the bank reconciliation statement?", ["2 only", "1 only", "1 and 2 only", "1, 2 and 3"], 0]};
PAPERS[7]={t:"Part 7: Mock Exam 2",q:[]};NUM[7]=[];X[7]={1:["Kieron is an antiques dealer. His inventories includes a clock which cost $15,800. Kieron expects to spend $700 on repairing the clock which will mean that he will be able to sell it for $26,000. At what value should the clock be included in Kieron's inventories?", ["$16,500", "$15,800", "$25,300", "$26,000"], 1],2:["Are the below statements true or false in relation to the different types of accounting records that a business should maintain?", ["A non-current asset register includes only the cost element of non-current assets", "The bank general ledger account includes all cash transactions and, in addition, cash amounts owed to/from other parties", "The detailed listing of suppliers includes individual supplier accounts and their balances", "Sales can be calculated using both the sales returns and sales general ledger accounts"], [1, 1, 0, 0], "t", ["True", "False"]],3:["At 31 May 20X1 the balance on Caleb's bank statement showed that he had $3,732 in the bank. When he carried out the reconciliation between the bank statement and the bank account in his general ledger he found: (1) Unpresented cheques $5,729; (2) Outstanding lodgement $822; (3) Bank charges $495. What overdraft balance should be reported in Caleb's statement of financial position at 31 May 20X1?", [], 1175, "n"],4:["In which general ledger accounts would a manual journal entry for a cash receipt from a credit customer be recognised?", ["Bank and trade receivables", "Bank and trade payables", "Bank and sales", "Bank and purchases"], 0],5:["At 1 May 20X8, Trevor's allowance for irrecoverable debts was $1,468. At 30 April 20X9, the total balance on his trade receivables general ledger account was $88,463 and includes a balance of $563 which is irrecoverable. Trevor estimates that his allowance at 30 April 20X9 should be equivalent to 2% of the remaining balances. How should the movement in the allowance for irrecoverable debts be reported in the statement of profit or loss?", ["A charge of $1,758", "A credit of $1,758", "A credit of $290", "A charge of $290"], 3],6:["Which of the following correctly explain(s) why a trial balance is prepared? (1) To summarise the balances prior to preparation of the final accounts (2) To provide a basic check on the accuracy of bookkeeping entries", ["1 only", "Neither 1 nor 2", "Both 1 and 2", "2 only"], 2],7:["Accounting information should be free from material error and should be neutral. Which of the qualitative characteristics of accounting information does this describe?", ["Understandability", "Comparability", "Relevance", "Faithful representation"], 3],8:["At 31 October 20X3 Lalia had a bank overdraft of $3,681 and a bank loan of $16,800. The bank loan is due to be repaid by three payments of $5,600 on 1 April 20X4, 1 April 20X5 and 1 April 20X6. Which TWO of the following show how these amounts should be reported in Lalia's statement of financial position at 31 October 20X3?", ["Current liabilities $3,681", "Current liabilities $9,281", "Non-current liabilities $11,200", "Non-current liabilities $16,800"], [1, 2], "m"],9:["A trainee accountant has prepared the following current account for a partner:<br>Debit side: Interest on capital $560; Salary $300; Balance c/f $2,174 (total $3,034)<br>Credit side: Balance b/f $54; Drawings $1,240; Net profit $1,740 (total $3,034)<br>The balance brought forward is entered correctly and the other entries are all correct in amount. However the trainee accountant thinks she might have mixed up some of the debits and credits.<br>What is the balance carried forward on the account after the errors have been corrected?", [], 1414, "n"],10:["A business has a year-end date of 31 December 20X7. Identify whether each of the following items should be recognised as a provision or an accrual.", ["An employee raised legal action on 4 December 20X7 against the business and it is probable that the employee will win the case, which is expected to be concluded in March 20X8", "An invoice was received on 6 January 20X8 and related to rental charges for the previous three months"], [0, 1], "t", ["Provision", "Accrual"]],11:["At 1 April 20X3, Zia's net assets were $58,000. In June 20X3, Zia invested a further $22,000 of capital. During the year, the business generated $41,000 of profit. Zia took drawings of $18,000 in March 20X4. What is the carrying amount of Zia's net assets at 31 March 20X4?", [], 103000, "n"],12:["Which of the following correctly calculates closing capital?", ["Capital introduced - Drawings - Profit - Opening capital", "Capital introduced + Drawings + Profit + Opening capital", "Capital introduced - Drawings + Profit + Opening capital", "Capital introduced + Drawings - Profit + Opening capital"], 2],13:["Wilson has returned goods that he bought on credit. Which TWO of the following form the journal entry that Wilson should record in his general ledger?", ["Dr Purchase returns", "Cr Trade payables", "Dr Trade payables", "Cr Purchase returns"], [2, 3], "m"],14:["At 1 May 20X0, Lim owed his suppliers $17,822. At 30 April 20X1 he owed $16,385. During the year to 30 April 20X1 he paid his suppliers $131,740, and made a contra entry with trade receivables of $800. What was the value of his purchases for the year to 30 April 20X1?", [], 131103, "n"],15:["Linh has a sole supplier and has the following trade payables general ledger account:<br>Debit: Bank $103,000; Returns $12,000; Closing balance $37,800 (total $152,800)<br>Credit: Opening balance $85,600; Purchases $67,200 (total $152,800)<br>What does the $37,800 closing balance represent?<br>(1) The balance to be reconciled to the supplier statement<br>(2) The amount carried forward to the next accounting period<br>(3) The amount of accrued expenses presented in the trial balance", ["1 and 2 only", "2 and 3 only", "1, 2 and 3"], 0],16:["Jean uses a computerised accounting system integrated with the sales and purchases modules only, so any financial data entered is reflected across the full accounting system. Jean does not accept cash sales or make cash purchases. Which of the following statements are correct when Jean inputs data from a sales order to the sales module?", ["The detailed listing of customer accounts is updated automatically", "The detailed listing of supplier accounts is updated automatically", "The associated cost of goods sold is recognised in the cost of sales and inventories general ledger accounts", "The sale is recognised in both the sales and trade receivables general ledger accounts"], [0, 1, 1, 0], "t", ["Correct", "Incorrect"]],17:["Which of the following has been accounted for correctly?", ["Loss on disposal of property, plant and equipment: Dr Bank; Dr Operating expenses; Cr Property, plant and equipment", "Repayment of loan liability: Dr Bank; Cr Loan payable", "Equipment withdrawn for owner's personal use: Dr Equipment; Cr Drawings", "Returns from customers: Dr Trade payables; Cr Purchase returns"], 0],18:["Jane is preparing her bank reconciliation. The bank balance in her general ledger is $422 credit. The only items which need to be dealt with are: (1) A cheque for $822 issued to a supplier which has not yet appeared on the bank statement; (2) Interest received of $153 which was credited by the bank, but not recorded by Jane. What is the unreconciled, closing balance on Jane's bank statement?", ["$269 overdrawn", "$1,091 overdrawn", "$553 cash at bank", "$1,397 cash at bank"], 2],19:["Candy started her own business during the year. The following is a list of Candy's capital injections. Which TWO of these would be included in the capital section of her statement of financial position?", ["A $600 business loan from Candy's bank", "$400 cash paid into the business by Candy from her personal bank account", "A van worth $350 bought by Candy for the business using her personal bank account", "A $150 loan to the business from Candy's friend Jim, repayable in two months' time"], [1, 2], "m"],20:["In the year to 31 October 20X0 Vlad's sales were $142,200, all of which were made at a mark-up of 20%. His opening inventory value was $5,400 and his closing inventory value was $3,600. What was the value of Vlad's purchases in the year to 31 October 20X0?", [], 116700, "n"],21:["Is each of the following statements about going concern correct?", ["Financial statements must always be prepared on the going concern basis", "If a business is not considered to be a going concern, financial statements should not be prepared"], [1, 1], "t", ["Yes", "No"]],22:["Which of the following is the correct manual journal entry to recognise the depreciation charge for the year?", ["Dr Property, plant and equipment; Cr Depreciation charge", "Dr Depreciation charge; Cr Bank", "Dr Depreciation charge; Cr Property, plant and equipment", "Dr Bank; Cr Depreciation charge"], 2],23:["Kieron is an antiques dealer. His inventories includes a clock which cost $15,800. Kieron expects to spend $700 on repairing the clock which will mean that he will be able to sell it for $26,000. At what value should the clock be included in Kieron's inventories?", ["$16,500", "$15,800", "$25,300", "$26,000"], 1],24:["Emily's draft accounts report a profit of $11,855. However an accrual of $398 was treated as a prepayment, and a prepayment of $480 was incorrectly recorded as $522. What is the correct profit?", ["$11,017", "$11,415", "$11,499", "$12,693"], 0],25:["At 31 May 20X3 Shelina's allowance for irrecoverable debts was $1,157. She wishes to write off a balance of $178 as irrecoverable. At 31 May 20X2 her allowance for irrecoverable debts was $1,284. What charge should be reported in Shelina's statement of profit or loss for the year to 31 May 20X3 for irrecoverable debt expense?", ["$305", "$51", "$1,157", "$1,335"], 1],26:["Nigel has closing inventories with a total cost of $38,750. This includes damaged items which cost $3,660. It will cost Nigel $450 to repair these. He will be able to sell them for $1,500 after the repairs are completed. What is the value of closing inventories?", ["$35,090", "$36,140", "$36,590", "$38,750"], 1],27:["Zhenya uses a basic computerised accounting package. The sales and purchases systems are integrated. However, an imbalanced manual journal entry will be automatically balanced by posting to a suspense account. A $1,000 (credit) suspense account has been reported on the trial balance. Which of the following would explain the difference?", ["A manual journal entry for a $2,000 cash receipt from a credit customer was debited correctly to bank but credited to trade receivables with only $1,000 in the general ledger", "Depreciation charges of $1,000 were incorrectly coded to the taxation expense in the general ledger", "A manual journal entry for interest received of $500 was debited to bank and credited to other income in the general ledger", "A $1,000 accrual for rental charges was omitted from the general ledger"], 0],28:["Boris receives rental income of $1,200 each month. His tenant pays the rent relating to the month by electronic bank transfer on the last day of each month. What debit and credit should Boris record for the payment received?", ["Credit", "Debit"], [0, 1], "t", ["Rental Income $1,200", "Bank $1,200", "Cash $1,200"]],29:["Paulo and Claude are in partnership sharing profits and losses in the ratio 2:3. In the year to 31 March 20X0 the partnership profit was $144,890 and the partners withdrew $35,000 each. Interest is charged at 8% on all drawings. Interest on capital for the year was: Paulo $11,450; Claude $9,770. What is Paulo's share of the residual profit?", ["$47,228", "$51,708", "$77,562", "$60,358"], 1],30:["Gary bought a new machine. The invoice included costs for the following: (1) Installation charges (2) Routine maintenance for the first year of operation (3) Testing the machine prior to operation. Which of the costs are asset expenditure?", ["1 and 3 only", "2 and 3 only", "1 and 2 only", "1, 2 and 3"], 0],31:["In June 20X8 Laura bought goods for $12,000. She paid $11,000 of the amount due by electronic bank transfer and agreed a 45-day credit period for the balance. She has not made any further payments in the month of June 20X8. She intends to buy more goods for $13,000 in July 20X8. What amount should be reported for Laura's trade payables at 30 June 20X8?", ["$25,000", "$14,000", "$13,000", "$1,000"], 3],32:["Which of the following would normally be recorded in a non-current asset register? (1) The location of each asset (2) The serial number of each asset (3) Accumulated depreciation on each asset", ["1, 2 and 3", "1 and 3 only", "2 and 3 only", "1 only"], 0],33:["In the year to 30 November 20X9 Lui accounted for $7,000 of expenditure on machinery repairs as the cost of a new machine. Lui depreciates machinery on a straight-line basis over 10 years and charges depreciation for a full year in the year an asset is acquired. What is the effect of the error on Lui's profit for the year to 30 November 20X9?", ["Understated by $7,700", "Overstated by $7,700", "Overstated by $6,300", "Understated by $6,300"], 2],34:["Albert and Len are in partnership. The correct entry for the partners' drawings has been made in the cash account. A separate capital account and current account is maintained for each partner. What entry is needed to complete the posting for the partners' drawings?", ["A credit entry in the partners' capital accounts", "A debit entry in the partners' capital accounts", "A credit entry in the partners' current accounts", "A debit entry in the partners' current accounts"], 3],35:["Sabrina sold goods with a list price of $1,200 to Marcus. Marcus receives a trade discount of 10% and a settlement discount of 5% for payment within 14 days. Marcus is expected to take advantage of the settlement discount. What amount should be recorded in revenue relating to this sale?", [], 1026, "n"],36:["Jordan pays all their suppliers within the 60-day credit term offered. Where should a credit balance on Jordan's trade payables general ledger account be presented in the financial statements?", ["As a non-current liability in the statement of financial position", "As a current liability in the statement of financial position", "As an expense in the statement of profit or loss", "As a negative amount in current assets on the statement of financial position"], 1],37:["On 1 July 20X8, Deniz had a balance on their trade payables general ledger account of $2,100. All of Deniz's sales and purchases are on credit. The following report was run for July:<br>Transactions report (1 July 20X8 to 31 July 20X8)<br>Description<br>$<br>Purchases<br>3,600<br>Sales<br>4,800<br>Payments to suppliers<br>2,700<br>Receipts from customers<br>3,100<br>Settlement discount received<br>300<br>Settlement discount allowed<br>400<br>What is the balance on Deniz's trade payables general ledger account at 31 July 20X8?", [], 2700, "n"],38:["A supplier sent Giang a statement showing a balance outstanding of $55,200. Giang's detailed listing of supplier accounts shows a balance of $55,700 for this supplier. Which of the following could be the reason for the difference?", ["Goods returned by Giang worth $500 which the supplier has not yet accounted for", "The supplier has allowed a $500 settlement discount which has been omitted from Giang's accounting system", "Giang has paid the supplier $500 which the supplier has not yet recognised", "The supplier sent an invoice for $500 which has not yet been recognised by Giang"], 1],39:["Maryam and Ariel have been in partnership together for a number of years and share profits and losses in the ratio 5:4. At 1 March 20X9 Jana was admitted to the partnership when the goodwill was valued at $75,000. The partners decided that goodwill would not be maintained in the accounts and drew up a new partnership agreement stating that profits would now be shared in the ratio 1:1:1. How much must Jana contribute to the partnership to ensure that her opening capital balance is nil?", [], 25000, "n"],40:["Andrew's trial balance at 31 October 20X7 includes the following: $<br>Machinery at cost<br>85,800<br>Accumulated depreciation on machinery<br>21,750<br>Trade receivables<br>42,650<br>Allowance for irrecoverable debts<br>1,570<br>Bank overdraft<br>6,470<br>Inventories at 1 November 20X6<br>21,650<br>His inventories at 31 October 20X7 are valued at $22,300.<br>What amount should be reported for current assets in Andrew's statement of financial position at 31 October 20X7?", [], 63380, "n"],41:["At 30 November 20X5 Jenny had a bank loan payable of $8,500 and $678 of cash in her bank account. How should these amounts be recorded on Jenny's opening trial balance at 1 December 20X5?", ["Debit $7,822", "Credit $7,822", "Credit $8,500 and Debit $678", "Debit $8,500 and Credit $678"], 2],42:["Fede's draft financial statements reported a profit for the year of $16,518 and a net asset total of $85,288. In the draft financial statements, Fede had incorrectly valued closing inventories at $69,780. The correct value was $76,980. When the error is corrected, what will be Fede's profit for the year and net asset total?", ["Profit for the year: $9,318; Net assets: $78,088", "Profit for the year: $23,718; Net assets: $78,088", "Profit for the year: $9,318; Net assets: $92,488", "Profit for the year: $23,718; Net assets: $92,488"], 3],43:["Sanjay is registered for sales tax. He has recently purchased goods for resale and received an invoice for a total of $360, including sales tax. The rate of sales tax is 20%. At what amount should Sanjay record the purchase in his purchases account?", [], 300, "n"],44:["Valera entered a sales invoice in the computerised accounting system incorrectly as $3,300 instead of the invoice amount of $330. What manual journal entry is required to correct for this error?", ["Dr Sales 3,630; Cr Trade receivables 3,630", "Dr Sales 2,970; Cr Trade receivables 2,970", "Dr Trade receivables 3,630; Cr Sales 3,630", "Dr Trade receivables 2,970; Cr Sales 2,970"], 1],45:["What is the main purpose of a statement of financial position?", ["To report the assets, liabilities and capital of the business at a particular date", "To report the growth in the value of capital since the business was established", "To provide a valuation of the business at a particular date", "To provide information about the activities of the business over a period of time"], 0],46:["On checking his draft financial statements Ricardo notes that he had omitted an accrual for $754 and a prepayment for $388. By how much is the value of his current assets understated?", [], 388, "n"],47:["Ed's year end is 30 September. He depreciates office furniture at 15% per annum on the straight line basis. A full year's depreciation is charged in the year an asset is purchased, and no depreciation is charged in the year it is sold. In March 20X5 Ed bought office furniture for $80,000. If he sells the office furniture for $39,000 in July 20X8 what will Ed's profit or loss be on disposal?", ["A profit of $5,000", "A profit of $7,000", "A loss of $5,000", "A loss of $7,000"], 2],48:["On 10 May Amanda bought goods for resale. Her supplier allowed her a credit period of 30 days. By year end the goods have not been sold. How is Amanda's accounting equation affected by the transaction?", ["Assets: Increased; Liabilities: Unchanged; Capital: Reduced", "Assets: Increased; Liabilities: Increased; Capital: Unchanged", "Assets: Reduced; Liabilities: Reduced; Capital: Unchanged", "Assets: Unchanged; Liabilities: Increased; Capital: Reduced"], 1],49:["Gilda is preparing her bank reconciliation statement. Following the necessary correcting entries, the balance on the bank account in her general ledger is $4,782 credit. She still has to deal with the following: (1) Her bank charged fees of $365 to her account in error; (2) She has unpresented cheques totalling $1,745; (3) She has an outstanding lodgement of $1,519. What is the overdraft balance on her bank statement?", [], 4921, "n"],50:["A sales invoice for $3,450 was recorded in Susan's general ledger as a credit note for $3,540. If the errors are not corrected before the final accounts are drafted how will Susan's profit for the year be affected?", ["Understated by $90", "Overstated by $6,990", "Understated by $6,990", "Overstated by $90"], 2]};
PAPERS[8]={t:"Part 8: Mock Exam 3",q:[]};NUM[8]=[];X[8]={1:["Which of the following statements about a trial balance are correct? (1) The trial balance includes a list of all transactions which took place in the year (2) The trial balance is part of the double entry system<br>(3) All bookkeeping errors can be identified by reviewing the trial balance", ["1 and 3", "2 and 3", "1 and 2", "None of the above"], 3],2:["Joe has prepared the following manual journal entry: Dr Cash $850; Cr Trade receivables $850.<br>Which of the following is the correct narrative for the manual journal entry?", ["Cash sales", "Cash purchases", "Cash receipt from customer", "Cash payment to supplier"], 2],3:["Ai and Bhavik are in partnership sharing profits equally. On 1 December 20X0 Corinne joined the partnership and the partners agree to change the profit sharing ratio to 3:4:1 to Ai, Bhavik and Corinne respectively. At that date the goodwill of the partnership had been valued at $16,000 and the capital accounts are $24,000 Cr for Ai and $32,000 Cr for Bhavik. Corinne paid $4,000 into the partnership. Goodwill will not be maintained in the accounts. What is Ai's capital balance after Corinne had joined the partnership?", ["$30,000", "$24,000", "$26,000", "$32,000"], 2],4:["If a partnership maintains both capital and current accounts, a partner's drawings and interest on drawings should be recorded in which TWO of the following?", ["Interest on drawings: capital account", "Interest on drawings: current account", "Drawings: current account", "Drawings: capital account"], [1, 2], "m"],5:["In the year ended 30 November 20X9, Karl sold a machine for $5,800. The machine had been bought for $15,000 in July 20X5. Karl depreciates machinery at 20% per annum on the diminishing-balance basis. He charges a full year's depreciation in the year an asset is purchased and no depreciation in the year of disposal. What was the gain or loss on disposal of the machine?", ["$344 loss", "$344 gain", "$2,800 loss", "$2,800 gain"], 0],6:["In which general ledger accounts would a computerised accounting system recognise the input of a purchase invoice?", ["Purchases and trade payables", "Sales and trade payables", "Sales and trade receivables", "Purchases and trade receivables"], 0],7:["At 1 June 20X8, the value of Lindsay's net assets was $144,804. At 31 May 20X9 the value was $191,779. During the year to 31 May 20X9 Lindsay introduced $52,250 of capital and her drawings were $34,400. What was Lindsay's profit for the year to 31 May 20X9?", [], 29125, "n"],8:["Are the following items recognised as an accrual or as a prepayment?", ["A business has estimated its telephone expense for sales employees during the year but is yet to receive an invoice", "A business received an invoice from its energy provider on 2 February relating to December of the prior financial year"], [0, 0], "t", ["Accrual", "Prepayment"]],9:["Is each of the following statements about double entry bookkeeping true or false?", ["In double entry bookkeeping we have a basic check on the accuracy of the entries, as the total value of the debit entries and the total value of credit entries should be equal", "'Double entry bookkeeping' means that two sets of records are maintained"], [0, 1], "t", ["True", "False"]],10:["Amy is registered for sales tax and her sales returns were $880, excluding sales tax at 17.5%. How should this information be recorded in Amy's general ledger?", ["Dr Trade receivables $1,034; Cr Sales returns $1,034", "Dr Sales returns $880; Dr Sales tax $154; Cr Trade receivables $1,034", "Dr Sales returns $880; Cr Trade receivables $880", "Dr Trade receivables $1,034; Cr Sales returns $880; Cr Sales tax $154"], 1],11:["Arya has the following sales general ledger account:<br>Debit: Returns $3,000; Closing balance $204,500 (total $207,500)<br>Credit: Opening balance nil; Bank $12,000; Trade receivables $195,500 (total $207,500)<br>What does the $204,500 closing balance represent?<br>(1) The total sales amount presented in the trial balance<br>(2) The amount carried forward to the next accounting period<br>(3) The trade receivables balance presented in the trial balance", ["1 only", "2 and 3 only", "1 and 2 only", "1, 2 and 3"], 0],12:["Which of the following has been accounted for correctly?", ["Payment to a supplier: Dr Trade payables; Cr Bank", "Cash purchase of equipment: Dr Property, plant and equipment - cost; Cr Trade payables", "Increase in allowance for irrecoverable debt: Dr Allowance for irrecoverable debt; Cr Operating expenses", "Gain on disposal of property, plant and equipment: Dr Bank; Dr Operating expenses; Cr Property, plant and equipment"], 0],13:["At 30 November 20X9, Marek's trial balance includes: Inventories at 1 December 20X8 $17,558 Dr; Trade receivables $31,749 Dr; Prepayments $3,629 Dr; Trade payables $24,928 Cr; Accruals $5,291 Cr; Bank account (overdraft) $1,827 Cr; Allowance for irrecoverable debts at 1 December 20X8 $683 Cr.<br>Inventories at 30 November 20X9 were valued at $18,736 and the allowance for irrecoverable debts is to be adjusted to $744.<br>What value should be reported on Marek's statement of financial position at 30 November 20X9 for current assets?", [], 53370, "n"],14:["In Benni's records for the year to 31 October 20X8, expenditure on a depreciable asset has been incorrectly classified as an expense charged to profit or loss. If the error is not corrected, what is the effect on Benni's profit for each of the years to 31 October 20X8 and 31 October 20X9?", ["Year to 31 October 20X8", "Year to 31 October 20X9"], [0, 1], "t", ["Understated", "Overstated"]],15:["Which of the following is the correct manual journal entry to recognise the decrease in a provision, following a change in estimates?", ["Dr Provisions; Cr Operating expenses", "Dr Operating expenses; Cr Provisions", "Dr Bank; Cr Provisions", "Dr Provisions; Cr Bank"], 0],16:["Ethel's trial balance includes: Trade receivables $136,853 Dr; Allowance for i
