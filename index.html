for(const k in PAPERS){const q=PAPERS[k].q;q.forEach((e,j)=>e.n=NUM[k][j]);for(const n in X[k]){const e=X[k][n];e.n=+n;q.push(e)}q.sort((a,b)=>a.n-b.n)}


const app=document.getElementById('app');
let sel=null,paper=null,i=0,ans=[],shown=[],tried=[],timer=null,secs=5700;
const typ=q=>q[3]||'s';
function num(a){return Math.abs(parseFloat(String(a).replace(/[,$\s]/g,'')))}
function ok(q,a){const t=typ(q);if(a==null||a==='')return false;
 if(t=='s')return a===q[2];
 if(t=='m')return a.length===q[2].length&&[...a].sort((x,y)=>x-y).join()===q[2].join();
 if(t=='t')return q[2].every((v,r)=>a[r]===v);
 const v=num(a);return !isNaN(v)&&Math.abs(v-q[2])<0.005}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function push(st,h){try{history.pushState(st,'',h)}catch(e){}}
function hdr(){
 const n=PAPERS[paper].q.length,pct=Math.round(i/n*100);
 return `<div class="hd"><div class="logo">ACCA</div>
 <div class="cell"><span>Question ${PAPERS[paper].q[i].n}</span></div>
 <div class="cell"><span id="mk">${ok(PAPERS[paper].q[i],ans[i])?'1 of 1':'0 of 1'} marks</span></div>
 <div class="cell"><span>Time Remaining</span><b id="tm">${fmt(secs)}</b></div>
 <div class="cell prog"><div class="bar"><i style="width:${pct}%"></i><span>Exam ${pct}% Complete</span></div><span style="color:var(--org);font-size:13px;margin-top:3px">&#9776; Test Progress Details &#9660;</span></div>
 <div class="cell org" style="border-left:1px solid var(--line)">FA2-Maintaining Financial Records</div>
 <div class="exit" onclick="home()"><u>&#10162;</u>Exit</div></div>`;
}
function renderHome(){
 clearInterval(timer);paper=null;
 app.innerHTML=`<main class="home"><div class="logo" style="margin:0 auto;height:56px;width:90px;font-size:26px">ACCA</div>
 <h1>FA2 – Maintaining Financial Records</h1><p>Choose a past paper section, then press Start.</p>
 ${Object.keys(PAPERS).map(k=>`<button class="pp ${sel==k?'sel':''}" onclick="sel=${k};renderHome()">Past Paper ${k}<small>${PAPERS[k].t} · ${PAPERS[k].q.length} questions</small></button>`).join('')}
 <button class="p" style="margin-top:12px" ${sel?'':'disabled'} onclick="start()">Start</button></main>`;
}
function home(){renderHome();push({v:'home'},'#home')}
function start(){paper=sel;i=0;ans=[];shown=[];tried=[];secs=5700;clearInterval(timer);
 timer=setInterval(()=>{secs--;const e=document.getElementById('tm');if(e)e.textContent=fmt(secs);if(secs<=0)finish()},1000);
 push({v:'q',i:0},'#q1');show()}
function go(n){i=n;push({v:'q',i:n},'#q'+(n+1));show()}
function show(){
 const q=PAPERS[paper].q[i],n=PAPERS[paper].q.length,t=typ(q),a=ans[i],sh=shown[i];let b='',sub='';
 if(t=='s'){
  b=q[1].map((o,k)=>{let cl='';if(a===k)cl=ok(q,a)?'ok':'bad';else if(sh&&k===q[2])cl='ok';
   return `<div class="opt ${cl}" onclick="pick(${k})"><span class="r"></span><span>${o}</span></div>`}).join('')}
 else if(t=='m'){
  const sa=a||[],full=sa.length>=q[2].length;sub=`<p class="sub">Select ${q[2].length} answers</p>`;
  b=q[1].map((o,k)=>{const on=sa.includes(k);let cl='';
   if(on){cl=full?(q[2].includes(k)?'ok':'bad'):'on'}else if(sh&&q[2].includes(k))cl='ok';
   return `<div class="opt ${cl}" onclick="pick(${k})"><span class="r sq ${on&&!full?'':''}"></span><span>${o}</span></div>`}).join('')}
 else if(t=='t'){
  b='<table class="tb"><tr><th></th>'+q[4].map(h=>`<th>${h}</th>`).join('')+'</tr>'+q[1].map((o,r)=>`<tr><td>${o}</td>`+q[4].map((h,k)=>{
   const on=(a||[])[r]===k;let cl='';
   if(on)cl=q[2][r]===k?'ok':'bad';else if(sh&&q[2][r]===k)cl='ok';
   return `<td class="${cl}" onclick="pick(${r},${k})"><span class="r ${on?'on':''}"></span></td>`}).join('')+'</tr>').join('')+'</table>'}
 else{
  const g=ok(q,a),bad=tried[i]&&!g&&a!=null&&a!=='';
  b=`<div style="font-size:16px">$ <input id="nv" class="nv ${g?'good':bad?'badv':''}" value="${a??''}" inputmode="decimal" autocomplete="off" oninput="numIn(this)" onkeydown="if(event.key=='Enter')sub()"></div>`+(sh?`<p class="hint">Correct answer: $${q[2].toLocaleString()}</p>`:'')}
 const nm=t=='n';
 app.innerHTML=hdr()+`<main><p class="q">${q[0]}</p>${sub}${b}<div class="nav"><button ${i?'':'disabled'} onclick="go(i-1)">Previous</button>`+
  (nm?'<button onclick="sub()">Check</button>':'')+`<button class="s" onclick="shown[i]=1;show()">Show answer</button>
  <button class="p" onclick="${i<n-1?'go(i+1)':'finish()'}">${i<n-1?'Next':'Finish'}</button></div></main>`}
function pick(k,k2){const q=PAPERS[paper].q[i],t=typ(q);
 if(t=='s')ans[i]=k;
 else if(t=='m'){const a=ans[i]=ans[i]||[],x=a.indexOf(k);
  if(x>=0)a.splice(x,1);
  else{if(a.length>=q[2].length){const w=a.findIndex(v=>!q[2].includes(v));if(w<0)return;a.splice(w,1)}a.push(k)}}
 else{(ans[i]=ans[i]||[])[k]=k2}
 show()}
function numIn(el){const q=PAPERS[paper].q[i];ans[i]=el.value;const g=ok(q,el.value);
 el.className='nv '+(g?'good':'');document.getElementById('mk').textContent=(g?'1':'0')+' of 1 marks'}
function sub(){const el=document.getElementById('nv');ans[i]=el.value;tried[i]=1;show();const e=document.getElementById('nv');if(e)e.focus()}
function showResult(){const q=PAPERS[paper].q,s=q.filter((x,k)=>ok(x,ans[k])).length;
 app.innerHTML=`<main class="res"><div class="logo" style="margin:0 auto 14px;height:48px;width:80px">ACCA</div><p>${PAPERS[paper].t}</p><p><b>Score: ${s} / ${q.length}</b></p><button class="p" onclick="home()">Back to papers</button></main>`}
function finish(){clearInterval(timer);showResult();push({v:'res'},'#result')}
addEventListener('popstate',e=>{const st=e.state;
 if(st&&st.v=='q'&&paper!=null){i=st.i;show()}
 else if(st&&st.v=='res'&&paper!=null){showResult()}
 else renderHome()});
try{history.replaceState({v:'home'},'','#home')}catch(e){}
renderHome();
</script></body>
