53:['Which would be recorded in a partner’s current account? (1) Interest on capital (2) Interest on drawings (3) Share of residual profit (4) New capital introduced',['1, 2 and 3 only','1, 2, 3 and 4','1 and 2 only','3 and 4 only'],0],
54:['Which TWO of the following are reasons for extracting a trial balance?',['To ensure all transactions are in the correct ledger account','To ensure all transactions have been recorded in the books of prime entry','To summarise the ledger account balances','To ensure double entry has been maintained'],[2,3],'m'],
55:['In an extended trial balance the debit column of the statement of profit or loss section adds up to $112,000. The credit column adds up to $111,100. What does this mean?',['There is a cash balance of $900','The difference of $900 should be investigated; the two columns should always agree','A profit of $900 has been made','A loss of $900 has been made'],3],
57:['Which column in the extended trial balance would the following be extended to?',['Bank overdraft','Opening inventory','Insurance expense','Prepayments'],[1,0,0,1],'t',['Statement of profit or loss','Statement of financial position']],
58:['Which TWO of the following would be recorded in the journal?',['Discount allowed','Cash received','Correction of errors','Depreciation charge'],[2,3],'m'],
59:['At the beginning of the month Rob had a debit balance on his cash account of $1,240. He received cash of $300 from credit customers, made cash sales of $550 and spent $475 in cash on materials. What figure should be in his trial balance for the cash account?',[],1615,'n'],
60:['Sarah has decided to increase her receivables allowance. What entries should she make in her general ledger?',['Dr Receivables allowance; Cr Receivables expense','Dr Receivables allowance; Cr Receivables control','Dr Receivables control; Cr Receivables allowance','Dr Receivables expense; Cr Receivables allowance'],3],
61:['At the end of the year, Tank has not received his telephone bill relating to the last quarter. Will each be debited or credited to record this outstanding bill?',['Telephone','Accruals'],[0,1],'t',['Debit','Credit']],
62:['Are the following statements about inventory true or false?',['(i) Closing inventory is a debit to cost of sales','(ii) Inventory appears in the statement of financial position as a current liability'],[1,1],'t',['TRUE','FALSE']],
63:['Which TWO of the account balances would appear on the credit side of a trial balance?',['Purchases','Prepayments','Capital','Carriage inwards','Carriage outwards','Bank overdraft'],[2,5],'m'],
64:['Which are TRUE in relation to sales tax? (1) A registered entity collects the sales tax on behalf of the tax authority (2) Sales tax is borne by the final consumer (3) A registered entity cannot reclaim the sales tax on its purchases and expenses (4) All entities must charge sales tax on their output',['1 and 2 only','1, 2 and 3 only','1, 2, 3 and 4','2 and 4 only'],0],

69:['A trainee has prepared the following payables control account: Cash paid to suppliers $13,860; Purchases day book total $31,540; Contra with receivables control account $500; b/d $17,000. The list of balances from the payables ledger has been agreed with all suppliers, but does not reconcile to the payables control account. Which adjustment will correct the error?',['Record the contra with the receivables control account on the debit side of the account','Record the cash paid to suppliers on the credit side of the account','Include cash purchases from the cash book','Record the b/d balance on the debit side of the account'],0],

PAPERS[4]={t:"Part 4: Examiner's Report MCQs (2023–2026)",q:[]};PAPERS[5]={t:"Part 5: ACCA FA2 Examination Questions",q:[]};NUM[4]=[];NUM[5]=[];X[4]={1:["On which side of the relevant general ledger account will the 'carry forward balances' of (1) a bank overdraft and (2) accumulated depreciation be shown when closing off the accounts at the year end?", ["Both on the credit side", "Both on the debit side", "(1) debit, (2) credit", "(1) credit, (2) debit"], 1],2:["Emma has the following at 31 December 20X1: balance per bank general ledger account $2,358 Dr; bank charges not recorded $35; direct debits not recorded $240; automated receipts not recorded $750; unpresented cheques $3,000; receipts not yet credited by the bank $580. What is the correct reconciled bank balance?", ["$2,833", "$3,383", "$1,333", "$413"], 0],3:["In relation to partnerships, which statements are correct? (1) The personal liability of each partner is not limited to the capital they have invested. (2) The partnership must have a written partnership agreement. (3) All partners must participate in the day-to-day running. (4) Partners are jointly liable for the debts and obligations of the partnership.", ["1 and 2", "1 and 4", "2 and 3", "3 and 4"], 1],4:["Fiona charged depreciation at 30% reducing balance on motor vehicles costing $65,000 (previous depreciation $19,500) and sold plant with accumulated depreciation of $4,000. The brought forward accumulated depreciation was $36,000. What is the closing accumulated depreciation balance?", ["$45,650", "$49,650", "$51,500", "$55,500"], 0],5:["Naima's system auto-generates a suspense entry for imbalanced journals. Errors: (1) an accrual of $450 entered as $540; (2) a cash receipt of $560 from a credit customer recorded as a cash sale. Which statement is correct? (i) The transposition error will not be discovered through producing a trial balance. (ii) The cash receipt treated as a sale will lead to credits exceeding debits in the trial balance.", ["(i) only", "(ii) only", "Both (i) and (ii)", "Neither (i) nor (ii)"], 3],6:["Which of the following statements is/are true about using a cloud-based accounting system? (1) Backups must be taken regularly and held off site in fireproof storage. (2) Passwords should be regularly changed and not written down.", ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"], 1],7:["Which of the following statements about partnerships is/are true? (1) A new partner will always be required to introduce cash on admission. (2) Goodwill is the value of the tangible assets of the partnership at the date of admission of a new partner.", ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"], 3],8:["Seema asks why so many general ledger account codes are needed. Which statements correctly explain this? (1) To allow management to understand the different costs and income of a business. (2) To allow management to understand the different assets and liabilities of a business. (3) To keep a record of what they owe individual suppliers and customers.", ["1, 2 and 3", "1 and 2 only", "3 only", "1 and 3 only"], 1],9:["Luis recognised a cash sale of $40,000 by manual journal but (1) debited sales and credited bank, and (2) recorded both amounts as $30,000. By what amount will profit increase after correction?", ["$10,000", "$40,000", "$70,000", "$80,000"], 2],10:["Which TWO statements about accounting records are true? (1) Total sales for the period can be calculated using the sales returns general ledger account only. (2) The bank general ledger account includes payments made to suppliers. (3) The trade payables general ledger account contains a summary of each supplier's individual balances. (4) A non-current asset register includes a description of each asset, its cost and accumulated depreciation.", ["1 and 2", "2 and 4", "3 and 4", "1 and 3"], 1],11:["A trade receivable balance written off in the previous financial year has now been recovered. What is the effect of the recovery?", ["The receivables allowance will decrease", "The receivables balance will increase", "The capital balance will increase", "Sales revenue will increase"], 2],12:["A business has a 31 March year end but inventory was valued on 8 April. Movements 1-8 April: purchases $14,000; purchase returns $3,000; sales $8,000. Gross profit is 20% of sales. Inventory at cost on 8 April was $44,000. What was the cost of inventory at 31 March?", ["$39,400", "$41,000", "$48,600", "$26,600"], 0],13:["Naima and Burton share profits 2:1. Alan joins and the new ratio is 5:3:2. Goodwill of $360,000 is not carried into the new partnership. Which statements are true? (A) Burton's capital account will decrease due to the goodwill entries. (B) Alan will pay $72,000 for his share of goodwill. (C) $108,000 will be debited to Burton's capital account for goodwill. (D) $180,000 will be credited to Naima's capital account for goodwill.", ["A and B", "B and C", "C and D", "A and D"], 1],14:["Clara runs an online business selling catering equipment. Which of the following would be used to identify the point at which a sale is recognised?", ["Bank payment received from a customer", "Quote issued to a customer", "Delivery note signed by customer", "Purchase order received from customer"], 2],15:["Swift Co has a 31 March year end. Motor insurance of $7,200 (annual, expires 31 May 20X9) and buildings insurance of $30,000 (annual, expires 30 November 20X9) were each paid in full on the first day of the policy. What amount should be shown as prepaid insurance at 31 March 20X9?", ["$21,200", "$20,000", "$1,200", "$28,800"], 0],16:["Swallow Co's trade receivables increased by $600,000 during the year. Total sales were $12 million, of which 25% were cash sales. No discounts were allowed and no irrecoverable debts were written off. How much was received from credit customers?", ["$8.4m", "$9.6m", "$11.4m", "$12.6m"], 0],17:["Blackbird Co found that advertising expenses were incorrectly included in cost of sales. What is the effect on gross profit and profit for the year of correcting this?", ["Increase gross profit, decrease profit for the year", "Increase gross profit, no effect on profit for the year", "Decrease gross profit, increase profit for the year", "Decrease gross profit, no effect on profit for the year"], 1],18:["Hawk Co's supplier statement shows $8,710; Falcon Co's ledger balance for Hawk is $8,400. (1) A settlement discount of $40 has not been recognised by Falcon. (2) An invoice of $1,900 appears on the statement as $1,090. (3) A payment of $160 made on 28 December is not on the statement. (4) An invoice of $1,000 on the statement is omitted from Falcon's ledger. What is Hawk Co's reconciled trade payables balance?", ["$9,360", "$9,400", "$8,360", "$9,520"], 0]};X[5]={1:["Sybil's financial year ended on 30 November 20X2. She incurs the same telephone expense each month. The last invoice in respect of telephone expenses totalled $1,800. This invoice covered the three months to 31 October 20X2. What adjustment is required in respect of telephone expenses when preparing the accounts for the year to 30 November 20X2?", ["A prepayment of $1,200", "An accrual of $1,200", "A prepayment of $600", "An accrual of $600"], 3],2:["Which of the following accounting principles is most relevant in relation to the requirements of IAS 16 Property, Plant and Equipment in the following situations?", ["Classifying property as a non-current asset", "Depreciating property, plant and equipment"], [1, 0], "t", ["Accrual accounting", "Going concern"]],3:["Norman is entering information into the non-current asset register. Which TWO of the following pieces of information will be used when carrying out a verification of the physical presence of non-current assets?", ["Supplier", "Location", "Description", "Cost"], [1, 2], "m"],4:["John has been asked to provide a copy of his final accounts to his bank manager. What is the bank manager MOST likely to use the final accounts for?", ["To calculate the tax payable on John's business profit", "To ensure that the business is able to make repayments on a loan", "To ensure that John's profit margin is as good as the margin earned by other bank customers", "To ensure that the profit is sufficient to provide a good income for John"], 1],5:["In preparing the financial statements, it was discovered that an asset purchased for $10,000 in the last month of the accounting period had been debited to repairs in error. Depreciation is charged at 15% per annum on a monthly pro-rata basis. Are the following statements relating to the correction of the error true or false?", ["The error would need to be corrected before the financial statements were finalised", "The correction will decrease the profit for the year"], [0, 1], "t", ["True", "False"]],6:["Which of the following statements correctly describes the dual aspect convention of accounting?", ["Transactions are recorded in both the general ledger and in a separate detailed listing", "If a transaction requires two debit entries, two credit entries must also be made", "Only two general ledger accounts will be needed to record any transaction", "A change in the value of assets leads to an equal change in the value of liabilities plus capital"], 3],7:["Janet valued her inventory at 30 June 20X5 at its cost of $22,960. This includes some items which cost $1,950 which have been difficult to sell. Janet intends to have these items repackaged at a cost of $400. She can then sell them for $900. What will be the value of closing inventory in Janet's accounts at 30 June 20X5?", [], 21510, "n"],8:["A business has cash of $1,100, trade payables of $2,500, a loan liability of $8,000 and land of $16,000. What is the capital balance?", ["$10,500", "$27,600", "$6,600", "$16,000"], 2],9:["Adele runs a restaurant. In August 20X3 she received a letter from a lawyer representing a customer who claimed he suffered food poisoning after eating in the restaurant. The customer is claiming damages of $3,000. Adele offered to pay $300. Her lawyer's advice is that the case is likely to go to court and Adele is likely to be required to pay $1,500. The lawyer also advised that the court case is unlikely to take place before April 20X4. What amount should be provided for in respect of the claim in Adele's final accounts for the year ended 30 September 20X3?", ["$1,500", "$300", "$nil", "$3,000"], 0],10:["Ruth started trading a year ago. She sells her products at a mark-up of 30%. In the first year of trading, she bought goods for $25,800. Her sales in the year were $30,888. What is the value of Ruth's closing inventory?", [], 2040, "n"],11:["Fiona received a statement of account from a supplier, Raj, showing a balance outstanding to Raj of $15,400 at 31 December 20X8. Fiona's accounting system shows a balance outstanding to Raj of $16,200 at 31 December 20X8. From Fiona's accounting perspective, which TWO of the following statements could explain the difference?", ["Fiona had recorded a payment to a different supplier and allocated it incorrectly to Raj's account in Fiona's accounting system", "Raj had given Fiona a credit note for goods returned which had been omitted from Raj's supplier account in Fiona's accounting system", "Fiona had made a payment to Raj before the year end and which had not been reflected on the statement of account", "Fiona had recorded a purchase invoice from Raj in Raj's supplier account in Fiona's accounting system twice"], [1, 3], "m"],12:["Ari is registered for sales tax and he has purchased goods for resale. The invoice shows the cost of goods as $357.50, which includes sales tax at 10%. What amount should be debited to the purchases account?", ["$357.50", "$393.25", "$325.00", "$321.75"], 2],13:["At 1 September 20X1, the balance on Hai's capital account was $31,754. In the year to 31 August 20X2, he invested an additional $40,000 of personal funds and took a bank loan of $80,000 for the business. The statement of profit or loss for the year to 31 August 20X2 reported a profit of $48,634 and Hai's drawings during the year were $28,500. What is Hai's closing capital at 31 August 20X2?", [], 91888, "n"],14:["When Frank prepared his year end accounts, he made a calculation error and overstated the value of his closing inventory. What is the effect of this error on the profit for the year and the net assets at the year end?", ["Profit for the year", "Net assets at year end"], [1, 1], "t", ["Understated", "Overstated"]],15:["John needs to adjust his draft year-end accounts to record a prepayment of $1,500 and an accrual of $400. How will John's profit and net assets be affected by including the prepayment and the accrual?", ["Profit will increase by $1,100 | Net assets will increase by $1,100", "Profit will reduce by $1,900 | Net assets will reduce by $1,900", "Profit will reduce by $1,900 | Net assets will increase by $1,900", "Profit will increase by $1,100 | Net assets will decrease by $1,100"], 0],16:["One of Brian's customers returned goods valued at $670. These had been sold on credit. What double entry should Brian post to record the return of the goods?", ["Dr Sales returns $670 | Cr Trade receivables $670", "Dr Trade receivables $670 | Cr Bank $670", "Dr Bank $670 | Cr Trade receivables $670", "Dr Trade receivables $670 | Cr Sales returns $670"], 0],17:["Michael and Donald have been in partnership for several years, sharing profits and losses in the ratio 3:4. At 1 January they had the following credit balances: Michael – capital $65,000, current $11,486; Donald – capital $80,000, current $9,637. The partnership statement of profit or loss for the year to 31 December shows a net profit of $28,595 and the partners have made drawings of $16,500 each. What is the balance on Michael's current account at 31 December?", [], 7241, "n"],18:["At 1 October 20X1, Bakari's bank overdraft was $3,270. During the year to 30 September 20X2, he made electronic bank transfers with a total value of $189,642. His total lodgements during the year were $191,729. In addition, bank charges of $827 were incurred. What is Bakari's bank balance carried forward at 30 September 20X2 as per his accounting records?", ["$4,530 debit", "$6,184 debit", "$2,010 credit", "$356 debit"], 2],19:["Which of the following items would be included in the statement of financial position and which in the statement of profit or loss?", ["Cost of sales", "Capital", "Provisions", "Depreciation expense"], [1, 0, 0, 1], "t", ["Statement of financial position", "Statement of profit or loss"]],20:["Desmond is registered for sales tax. The tax rate is 17.5%. Quarter ended 31 March 20X3 (including sales tax): Sales – Jan $5,875, Feb $8,225, Mar $7,050. Purchases – Jan $3,525, Feb $4,700, Mar $5,875. The balance on the sales tax account at 1 January 20X3 was nil. What is the balance on the sales tax account at 31 March 20X3?", ["$1,050 due to tax authority", "$1,233.75 due from tax authority", "$1,050 due from tax authority", "$1,233.75 due to tax authority"], 0],21:["Riley has been trading as a retailer of shoes for many years. During the current year, Riley required more funds to expand his business so paid $20,000 into his business bank account from his personal savings. Which TWO of the following would be the dual effect of the above transaction for Riley's business?", ["Decrease in capital", "Increase in capital", "Increase in assets", "Decrease in assets"], [1, 2], "m"],22:["At 1 January 20X3 Wasan had 250 units of inventory valued at $155 each. During January: purchases – 10 January 140 units at $158; 22 January 110 units at $160. Sales – 5 January 175 units; 17 January 130 units; 28 January 105 units. Wasan values inventory using average cost (AVCO) on the periodic weighted average basis. What is the value of Wasan's inventory at 31 January 20X3 (to the nearest $1)?", ["$14,280", "$14,125", "$14,299", "$14,400"], 1],23:["Margaret compared her bank statement with the bank general ledger account and found they did not agree. She found two possible causes for the difference. Do these reasons for the difference require an entry in the bank general ledger account?", ["Some cheques have not been lodged by her suppliers", "The bank debited fees on her account"], [1, 0], "t", ["Yes", "No"]],24:["Alex and Jose are in partnership. Alex is entitled to a salary of $11,000 per year. In the year to 31 December 20X1, the net profit was $43,877. Interest on capital: Alex $8,000, Jose $9,500. Interest on drawings: Alex $3,500, Jose $5,400. What is the residual profit for the year to 31 December 20X1?", [], 24277, "n"],25:["Which of the following statements regarding inventory valuation is correct?", ["The purchase price of items which have been held for the longest period is an acceptable method for valuing inventory", "All items held in inventory should be valued at cost", "Inventory valuation should exclude profit that has not yet been earned", "Inventory should be valued at anticipated selling price less any cost which will be incurred"], 2],26:["What is the purpose of charging depreciation?", ["To reflect the fair value of the asset in the statement of financial position", "To ensure that funds are available for the eventual replacement of the non-current asset", "To reflect the falling realisable value of an asset", "To allocate the cost of a non-current asset over the accounting periods expected to benefit from its use"], 3],27:["Samantha has prepared the following bank reconciliation statement at 31 March: Balance on bank statement $1,250 (overdrawn); Unpresented cheques $748; Outstanding lodgement $2,200; Balance on general ledger account $202 (debit). How should the bank balance be reported in Samantha's statement of financial position at 31 March?", ["$202 as a current liability", "$1,250 as a current asset", "$202 as a current asset", "$1,250 as a current liability"], 2],28:["At the start of the year, the balance on Toni's capital account was $35,869. During the year Toni made drawings of $17,800 and the net profit for the year was $18,700. What is Toni's closing capital at the end of the year?", [], 36769, "n"],29:["At 30 November, Charles is owed a total of $72,660 by his customers. His allowance for irrecoverable debts brought forward is $11,700. He estimates that his allowance for the current year should be equivalent to 15% of the amounts due from customers. What amount should be included in the statement of profit or loss for the irrecoverable debts expense for the year to 30 November?", ["$801 credit", "$10,899 credit", "$801 debit", "$10,899 debit"], 0],30:["Sarah's bank general ledger account at 30 April 20X4 shows a debit balance of $2,280. Comparison with the bank statement reveals: uncleared electronic payments $780; bank charges not in the bank general ledger account $40; receipts not yet credited by the bank $450; dishonoured cheque not in the bank general ledger account $120. What is the reconciled bank general ledger account balance at 30 April 20X4?", ["$1,340", "$2,120", "$1,950", "$2,360"], 1],31:["Maura and Delia have been in partnership sharing profits and losses equally. At 1 March 20X1 the total value of the balances on their capital and current accounts was $225,000. At that date Delia was admitted to the partnership and it was agreed that: (1) the partners would share profits and losses equally; (2) goodwill would be valued at $75,000; (3) goodwill would not be maintained in the books; (4) Delia would introduce cash to ensure that her opening capital balance is nil. How much cash must Delia contribute?", ["$25,000", "$75,000", "$37,500", "$12,500"], 2],32:["How should prompt payment discounts be treated where a customer unexpectedly takes advantage of the discount?", ["As an expense deducted from gross profit", "As an expense included in cost of sales", "As a deduction from the value of discount received", "As a deduction from the value of sales"], 3],33:["Jessie's trial balance at 30 September 20X0 included: trade receivables $90,350 (Dr); allowance for irrecoverable debts brought forward $2,490 (Cr). (1) No entries have been made in respect of cash of $1,320 received from Jeffrey whose balance had been written off last year. (2) At 30 September 20X0 an irrecoverable balance of $1,950 is to be written off and the allowance is to be adjusted to 1.5% of the remaining balances. What figure will be reported in the statement of financial position at 30 September for trade receivables?", [], 87074, "n"],34:["In finalising the financial statements for the year ended 30 September 20X9, it was discovered that an invoice of $1,380 which was received on 12 November 20X9 in respect of insurance for the six months ended 31 October 20X9 had not been accounted for. Which of the following journal entries are required to account for the invoice received?", ["Dr Prepayments $230 | Cr Insurance expenses $230", "Dr Insurance expenses $1,380 | Cr Accruals $1,380", "Dr Prepayments $1,380 | Cr Insurance expenses $1,380", "Dr Insurance expenses $1,150 | Cr Accruals $1,150"], 3],35:["Alan purchased a machine on 1 March 20X1 for $12,000. He incurred additional costs for transportation of $1,300 and installation of $2,000. Shortly after he started to use the machine, it broke down and the repair of the machine cost $600. Alan charges depreciation at 10% per year on a straight-line basis with a full year's charge in the year of acquisition. What is the correct carrying amount of the machine at the year end date of 31 December 20X1?", ["$15,300", "$10,800", "$13,770", "$14,310"], 2],36:["Luis and David are in partnership sharing profits and losses in the ratio 3:2. David is entitled to a salary of $9,000 and interest on capital is paid at a rate of 8% per year. The partners' capital balances are: Luis $75,000; David $60,000. The partnership statement of profit or loss for the year shows a profit of $58,500. How much of the total profit is Luis entitled to?", [], 29220, "n"],37:["Which of the following correctly states the accounting equation?", ["Capital minus liabilities equals assets", "Assets plus capital equals liabilities", "Capital plus liabilities equals assets", "Assets plus liabilities equals capital"], 2],38:["Fred purchased a new van. The new van cost $9,000 and Fred paid a cheque for $2,500 to the dealer. In addition the dealer accepted an old van in part exchange. The old van had been bought three years ago for $11,600 and had been depreciated by $6,750. What is the gain or loss on disposal of the old van?", ["$6,500 loss", "$6,500 gain", "$1,650 gain", "$1,650 loss"], 2],39:["Lance is registered for sales tax and is entering a purchase invoice into the accounting system. The invoice shows: water treatment equipment $39,800; delivery $1,100; maintenance charge $3,980; sales tax $7,854; invoice total $52,734. What is the total value of asset expenditure on the invoice?", ["$52,734", "$44,880", "$39,800", "$40,900"], 3],40:["The computerised accounting system has produced a report showing year-end manual adjustments (extracts): Rent and rates – trial balance $18,000, adjustment $3,000 (prepayment); Stationery – trial balance $3,000, adjustment $1,200 (prepayment). Which TWO of the following statements are correct?", ["Rent and rates will be shown in the statement of profit or loss as an expense of $15,000", "Stationery will be shown in the statement of profit or loss as an expense of $1,800", "Rent and rates will be shown in the statement of profit or loss as an expense of $21,000", "Stationery will be shown in the statement of profit or loss as an expense of $4,200"], [0, 1], "m"],41:["Nandita has bought goods for resale on credit from Pascale. Nandita is not registered for sales tax. When the transaction is posted to the general ledger, which TWO of the following entries should be included?", ["Cr Bank", "Dr Purchases", "Dr Sales tax", "Cr Trade payables"], [1, 3], "m"],42:["At 30 September 20X3 Pamela's inventories were valued at $6, for(const k in PAPERS){const q=PAPERS[k].q;q.forEach((e,j)=>e.n=NUM[k][j]);for(const n in X[k]){const e=X[k][n];e.n=+n;q.push(e)}q.sort((a,b)=>a.n-b.n)}


const app=document.getElementById('app');
let sel=null,paper=null,i=0,ans=[],shown=[],tried=[],timer=null,secs=5700;
const typ=q=>q[3]||'s';
function num(a){return Math.abs(parseFloat(String(a).replace(/[,$\s]/g,'')))}
function ok(q,a){const t=typ(q);if(a==null||a==='')return false;
 if(t=='s')return a===q[2];
 if(t=='m')return a.length===q[2].length&&[...a].sort((x,y)=>x-y).join()===q[2].join();
 if(t=='t')return q[2].every((v,r)=>a[r]===v);
 const v=num(a);return !isNaN(v)&&Math.abs(v-q[2])<0.005}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function push(st,h){try{history.pushState(st,'',h)}catch(e){}}
function hdr(){
 const n=PAPERS[paper].q.length,pct=Math.round(i/n*100);
 return `<div class="hd"><div class="logo">ACCA</div>
 <div class="cell"><span>Question ${PAPERS[paper].q[i].n}</span></div>
 <div class="cell"><span id="mk">${ok(PAPERS[paper].q[i],ans[i])?'1 of 1':'0 of 1'} marks</span></div>
 <div class="cell"><span>Time Remaining</span><b id="tm">${fmt(secs)}</b></div>
 <div class="cell prog"><div class="bar"><i style="width:${pct}%"></i><span>Exam ${pct}% Complete</span></div><span style="color:var(--org);font-size:13px;margin-top:3px">&#9776; Test Progress Details &#9660;</span></div>
 <div class="cell org" style="border-left:1px solid var(--line)">FA2-Maintaining Financial Records</div>
 <div class="exit" onclick="home()"><u>&#10162;</u>Exit</div></div>`;
}
function renderHome(){
 clearInterval(timer);paper=null;
 app.innerHTML=`<main class="home"><div class="logo" style="margin:0 auto;height:56px;width:90px;font-size:26px">ACCA</div>
 <h1>FA2 – Maintaining Financial Records</h1><p>Choose a past paper section, then press Start.</p>
 ${Object.keys(PAPERS).map(k=>`<button class="pp ${sel==k?'sel':''}" onclick="sel=${k};renderHome()">Past Paper ${k}<small>${PAPERS[k].t} · ${PAPERS[k].q.length} questions</small></button>`).join('')}
 <button class="p" style="margin-top:12px" ${sel?'':'disabled'} onclick="start()">Start</button></main>`;
}
function home(){renderHome();push({v:'home'},'#home')}
function start(){paper=sel;i=0;ans=[];shown=[];tried=[];secs=5700;clearInterval(timer);
 timer=setInterval(()=>{secs--;const e=document.getElementById('tm');if(e)e.textContent=fmt(secs);if(secs<=0)finish()},1000);
 push({v:'q',i:0},'#q1');show()}
function go(n){i=n;push({v:'q',i:n},'#q'+(n+1));show()}
function show(){
 const q=PAPERS[paper].q[i],n=PAPERS[paper].q.length,t=typ(q),a=ans[i],sh=shown[i];let b='',sub='';
 if(t=='s'){
  b=q[1].map((o,k)=>{let cl='';if(a===k)cl=ok(q,a)?'ok':'bad';else if(sh&&k===q[2])cl='ok';
   return `<div class="opt ${cl}" onclick="pick(${k})"><span class="r"></span><span>${o}</span></div>`}).join('')}
 else if(t=='m'){
  const sa=a||[],full=sa.length>=q[2].length;sub=`<p class="sub">Select ${q[2].length} answers</p>`;
  b=q[1].map((o,k)=>{const on=sa.includes(k);let cl='';
   if(on){cl=full?(q[2].includes(k)?'ok':'bad'):'on'}else if(sh&&q[2].includes(k))cl='ok';
   return `<div class="opt ${cl}" onclick="pick(${k})"><span class="r sq ${on&&!full?'':''}"></span><span>${o}</span></div>`}).join('')}
 else if(t=='t'){
  b='<table class="tb"><tr><th></th>'+q[4].map(h=>`<th>${h}</th>`).join('')+'</tr>'+q[1].map((o,r)=>`<tr><td>${o}</td>`+q[4].map((h,k)=>{
   const on=(a||[])[r]===k;let cl='';
   if(on)cl=q[2][r]===k?'ok':'bad';else if(sh&&q[2][r]===k)cl='ok';
   return `<td class="${cl}" onclick="pick(${r},${k})"><span class="r ${on?'on':''}"></span></td>`}).join('')+'</tr>').join('')+'</table>'}
 else{
  const g=ok(q,a),bad=tried[i]&&!g&&a!=null&&a!=='';
  b=`<div style="font-size:16px">$ <input id="nv" class="nv ${g?'good':bad?'badv':''}" value="${a??''}" inputmode="decimal" autocomplete="off" oninput="numIn(this)" onkeydown="if(event.key=='Enter')sub()"></div>`+(sh?`<p class="hint">Correct answer: $${q[2].toLocaleString()}</p>`:'')}
 const nm=t=='n';
 app.innerHTML=hdr()+`<main><p class="q">${q[0]}</p>${sub}${b}<div class="nav"><button ${i?'':'disabled'} onclick="go(i-1)">Previous</button>`+
  (nm?'<button onclick="sub()">Check</button>':'')+`<button class="s" onclick="shown[i]=1;show()">Show answer</button>
  <button class="p" onclick="${i<n-1?'go(i+1)':'finish()'}">${i<n-1?'Next':'Finish'}</button></div></main>`}
function pick(k,k2){const q=PAPERS[paper].q[i],t=typ(q);
 if(t=='s')ans[i]=k;
 else if(t=='m'){const a=ans[i]=ans[i]||[],x=a.indexOf(k);
  if(x>=0)a.splice(x,1);
  else{if(a.length>=q[2].length){const w=a.findIndex(v=>!q[2].includes(v));if(w<0)return;a.splice(w,1)}a.push(k)}}
 else{(ans[i]=ans[i]||[])[k]=k2}
 show()}
function numIn(el){const q=PAPERS[paper].q[i];ans[i]=el.value;const g=ok(q,el.value);
 el.className='nv '+(g?'good':'');document.getElementById('mk').textContent=(g?'1':'0')+' of 1 marks'}
function sub(){const el=document.getElementById('nv');ans[i]=el.value;tried[i]=1;show();const e=document.getElementById('nv');if(e)e.focus()}
function showResult(){const q=PAPERS[paper].q,s=q.filter((x,k)=>ok(x,ans[k])).length;
 app.innerHTML=`<main class="res"><div class="logo" style="margin:0 auto 14px;height:48px;width:80px">ACCA</div><p>${PAPERS[paper].t}</p><p><b>Score: ${s} / ${q.length}</b></p><button class="p" onclick="home()">Back to papers</button></main>`}
function finish(){clearInterval(timer);showResult();push({v:'res'},'#result')}
addEventListener('popstate',e=>{const st=e.state;
 if(st&&st.v=='q'&&paper!=null){i=st.i;show()}
 else if(st&&st.v=='res'&&paper!=null){showResult()}
 else renderHome()});
try{history.replaceState({v:'home'},'','#home')}catch(e){}
renderHome();
</script></body></html>
