rrecoverable debt $14,862 Cr. The allowance in the trial balance relates to the amount brought forward from the prior year. Ethel has calculated that her allowance for irrecoverable debt in the current year should be revised to $13,854. What should be reported for the irrecoverable debt expense in Ethel's statement of profit or loss?", ["A credit of $13,854", "A credit of $1,008", "A debit of $13,854", "A debit of $1,008"], 1],17:["At 1 May 20X8, the total balance on Trevor's trade receivables general ledger account was $88,463. During the year, Trevor discovers that a debt of $563 is irrecoverable. Which TWO of the following form the manual journal entry that is needed to write off the irrecoverable debt?", ["Dr Trade receivables", "Cr Irrecoverable debt expense", "Dr Irrecoverable debt expense", "Cr Trade receivables"], [2, 3], "m"],18:["Arnold claimed that some fish Burton sold to him in October 20X3 was contaminated and made his family ill. Arnold is seeking compensation of $4,000. Burton accepted responsibility and offered $1,500 as compensation. Arnold rejected this offer and has begun legal proceedings. Burton's legal advisor expects the court case to take place in March 20X4 and has estimated it is most likely that Burton will have to pay $2,500 in compensation. What amount should be included as a provision in Burton's statement of financial position at 30 November 20X3?", ["nil", "$2,500", "$4,000", "$1,500"], 1],19:["The bank account in Trish's general ledger has a credit balance of $358. The difference between this balance and the balance on her bank statement is due to: (1) Trish incorrectly recorded the value of a cheque paid to a supplier for $245 as $254; (2) A lodgement of $283 has still to be credited by the bank; (3) The bank charged interest of $104 on her overdraft. What is the correct credit balance on the bank account in Trish's general ledger?", [], 453, "n"],20:["Tony returned items of office stationery to his supplier and his supplier sent him a credit note. What debit and credit entries are required in Tony's general ledger?", ["Debit", "Credit"], [0, 2], "t", ["Trade payables", "Goods for resale - returns", "Office stationery"]],21:["In the year to 30 April 20X8, Tanya paid a total of $127,569 to her suppliers. Her opening and closing balances due to suppliers and her opening and closing inventory values were as follows:<br>Opening value ($)<br>Closing value ($)<br>Suppliers<br>11,564<br>12,826<br>Inventory<br>5,288<br>4,184<br>What was Tanya's cost of sales for the year to 30 April 20X8?", ["$128,673", "$129,935", "$127,727", "$126,307"], 1],22:["Maureen had an opening accrual of $533 for telephone expenses. During the year she paid invoices with a total value of $2,974. Her closing accrual was $488. What is the correct charge for telephone expenses in Maureen's statement of profit or loss?", [], 2929, "n"],23:["Nicky purchased goods with a cost of $6,000 excluding sales tax at a rate of 20%. Nicky is not registered for sales tax. What amount should Nicky record in their purchases general ledger account?", [], 7200, "n"],24:["Would each of the following errors be highlighted by extracting a trial balance?", ["A suspense account has been used when recording a cash sale", "Cash sales have been omitted from the records entirely"], [0, 1], "t", ["Yes", "No"]],25:["Dan has the following entries in their bank general ledger account:<br>Debit: Opening balance $750; Sales $4,200<br>Credit: Purchases $3,450; Expenses $300; Drawings $360<br>What is the closing balance in Dan's bank general ledger account, assuming no further transactions occur?", [], 840, "n"],26:["At 1 November 20X8, Borim had an accrual of $855 for fuel. During the year to 31 October 20X9 he paid invoices with a total value of $11,874. His closing accrual at 31 October 20X9 was $962. What is the charge for fuel in his statement of profit or loss for the year to 31 October 20X9?", [], 11981, "n"],27:["When goods are sold on credit at a profit, what is the effect on the assets and liabilities of the seller?", ["Assets", "Liabilities"], [0, 2], "t", ["Increase", "Reduce", "Do not change"]],28:["Tomomi had an allowance for irrecoverable debts at 1 April 20X1 of $10,080. At 31 March 20X2 the allowance has been calculated to be $7,200. During the year, an irrecoverable debt of $2,400 was incurred for which no allowance had previously been made. What is the impact of the irrecoverable debt expense on Tomomi's statement of profit or loss for the year ended 31 March 20X2?", ["Profit increased by $9,600", "Profit decreased by $9,600", "Profit increased by $480", "Profit decreased by $480"], 2],29:["Mio uses a basic computerised accounting package which automatically creates a suspense account when an imbalanced manual journal entry has been posted. Investigations have revealed two errors:<br>(1) A manual journal entry for depreciation charges of $3,360 credited the carrying amount of the asset but left the debit line item blank<br>(2) A manual journal entry for an accrual was debited to the correct expense account but at the incorrect amount of $2,600; the correct amount of $6,200 was credited to accruals<br>What is the balance in the suspense account, prior to correcting for the above errors?", ["$6,960 credit", "$6,960 debit", "$240 credit", "$240 debit"], 1],30:["You are preparing the final accounts for a business. The cost of the items in closing inventory is $41,875. This includes some items which cost $1,960 and which were damaged in transit. You have estimated that it will cost $360 to repair the items, and they can then be sold for $1,200. What is the correct inventory valuation for inclusion in the final accounts?", [], 40755, "n"],31:["Jo sold a non-current asset which had originally cost $87,600 for $43,000. At the date of disposal, the accumulated depreciation on the asset was $45,800. What is Jo's gain or loss on disposal of the non-current asset?", ["$1,200 gain", "$2,800 loss", "$1,200 loss", "$2,800 gain"], 0],32:["Jodie is carrying out a reconciliation of the bank account in her general ledger with the balance on her bank statement. She has found the following reasons for the difference between the two balances:<br>(1) Some electronic bank transfers to suppliers have not been processed by the bank<br>(2) The bank has made charges on Jodie's account<br>(3) A customer has paid $980 directly into Jodie's bank account Which of the above items will require an entry in the general ledger?", ["1, 2 and 3", "1 and 3 only", "2 and 3 only", "1 and 2 only"], 2],33:["At 31 October 20X8, Dong's statement of financial position reported non-current assets with a carrying amount of $237,950. In the year to 31 October 20X9, he scrapped assets with a carrying amount of $12,890, and bought new assets for $19,500. He has calculated that depreciation for the year to 31 October 20X9 is $46,900. What value should be reported for non-current assets in Dong's statement of financial position at 31 October 20X9?", [], 197660, "n"],34:["Charlie has been in business for several years. The total balance for all capital accounts was $13,000 on 1 January 20X9. During the year ended 31 December 20X9, Charlie introduced further capital of $4,000 and withdrew $1,500 from the business bank account for their own personal use. Charlie made a loss for the year ended 31 December 20X9 of $300. What is the total amount recognised as overall capital on Charlie's balance sheet as at 31 December 20X9?", ["$15,800", "$15,200", "$2,800", "$2,200"], 1],35:["Which of the following relates to the principle of going concern?", ["It requires that caution should be applied when exercising judgement about uncertainties", "It separates the individual who owns the business from the business itself", "It assumes that the business will continue in operation for the foreseeable future", "It requires that expenditure incurred in a particular accounting period should be accounted for in that period"], 2],36:["Vivienne and Robert are in partnership, sharing profits and losses in a ratio of 3:2. They maintain current accounts and capital accounts. In the last year, their profit before appropriations was $27,800. Robert is entitled to an annual salary of $3,800. During the year Vivienne and Robert made cash drawings of $12,000 each. What is Vivienne's share of the profit?", [], 14400, "n"],37:["Which of the following statements about financial records is/are true? (1) Financial records include documents received by a business such as supplier invoices (2) Businesses are legally required to keep financial records", ["Both statement 1 and statement 2", "Statement 2 only", "Statement 1 only", "Neither statement 1 nor statement 2"], 0],38:["A supplier sent Parminder a statement showing a balance outstanding of $46,650. Parminder's detailed listing of supplier accounts shows a balance of $47,700 for this supplier. Which of the following could be the reason for the difference?", ["An early settlement discount of $1,050 which has not yet been recognised by Parminder", "Parminder has paid the supplier $1,050 which the supplier has not yet recognised", "The supplier has sent an invoice for $1,050 which has not yet been received by Parminder", "Parminder has returned goods worth $1,050 which the supplier has not yet recognised"], 0],39:["You are preparing a client's financial statements. You know that the client's bookkeeper has correctly completed a reconciliation of the bank balance in the general ledger to the balance on the bank statement. General ledger balance $2,358 (credit); bank statement balance $1,053 (debit). The difference between the two balances is explained by unpresented cheques and outstanding lodgements. How should the bank balance be reported in the final accounts?", ["As a current asset of $1,053", "As a current liability of $1,053", "As a current liability of $2,358", "As a current asset of $2,358"], 2],40:["Which of the following correctly calculates the difference between closing capital and opening capital?", ["Profit - capital introduced - drawings", "Profit + capital introduced - drawings", "Profit + capital introduced + drawings", "Profit - capital introduced + drawings"], 1],41:["Which accounting principle is described by the following statement? 'For accounting purposes, a business is separate from its owners.'", ["Going concern", "Materiality", "Accruals basis", "Business entity"], 3],42:["Aamirah reconciled a supplier's balance within the trade payables general ledger account balance with the supplier statement balance. The following issues have been identified:<br>(1) Supplier payments totalling $9,000 have been paid by Aamirah but not yet recognised by the respective supplier<br>(2) Supplier invoices totalling $750 have been input twice, in error, to Aamirah's accounting system<br>(3) Credit notes received totalling $200 have been omitted, in error, from Aamirah's accounting system<br>All purchases and purchase returns are recognised in the same general ledger account in Aamirah's accounting system.<br>Which of the following manual journal entries will correct Aamirah's ledger accounts for the cumulative errors above?", ["Dr Trade payables 950; Cr Purchases 950", "Dr Purchases 1,850; Cr Trade payables 1,850", "Dr Trade payables 1,850; Cr Purchases 1,850", "Dr Purchases 950; Cr Trade payables 950"], 0],43:["Ed and Hilary are in partnership. Their draft statement of profit or loss reports a profit for the year of $75,862. Interest on drawings (Ed $2,754; Hilary $3,156) and interest on a loan from Hilary ($1,346) have not been included in calculating this figure. What is the correct profit for the year?", [], 74516, "n"],44:["Tim has recently commenced trading. The materials he uses in his business are subject to regular price rises. He is unsure how to value inventories and is trying to decide whether to use the first-in, first-out (FIFO) method or the continuous weighted average method. Which of the following statements is CORRECT?", ["The profit will be more accurate if FIFO is used", "Tim's profit will be unaffected by the method of valuation", "FIFO will, initially lead to higher reported profit", "Continuous weighted average will lead to higher reported profit"], 2],45:["Aziz performed supplier statement reconciliations for all accounts on the detailed listing of supplier balances at 31 March 20X9. The trade payables general ledger account shows a balance of $131,500 at that date. Aziz identified the following reconciling items:<br>(1) A supplier invoice totalling $1,000 was incorrectly input to the purchases module as $10,000<br>(2) Credit notes totalling $6,580 were received during the financial year but not recognised in the computerised accounting system<br>(3) A supplier statement showed an invoice for $4,500 but Aziz has not received the goods<br>What balance should be presented for trade payables on the statement of financial position as at 31 March 20X9?", [], 115920, "n"],46:["According to IAS 2 Inventories, which of the following methods is/are acceptable when valuing inventory? (1) Continuous weighted average (2) Last in, first out (LIFO) (3) Periodic weighted average", ["1 and 2 only", "1 and 3 only", "1, 2 and 3", "2 and 3 only"], 1],47:["Which of the following would all be presented on the same side of the trial balance?", ["Trade payables, accruals, drawings and capital introduced", "Inventories, bank overdraft, trade receivables and prepayments", "Discounts received, allowance for receivables, inventories and sales", "Property, inventories, cost of sales and administrative expenses"], 3],48:["Reyes uses a basic computerised accounting system which automatically posts to a suspense account where a manual journal entry is imbalanced. During the year, Reyes posted a manual journal entry which debited purchases by the correct amount of $3,920 but then also debited trade payables using the incorrect amount of $3,560. He did not process a credit side on the manual journal entry. What is the manual journal entry required to correct both errors made above?", ["Dr Trade payables 3,560; Cr Suspense account 3,560", "Dr Suspense account 7,480; Cr Trade payables 7,480", "Dr Trade payables 7,480; Cr Suspense account 7,480", "Dr Suspense account 3,560; Cr Trade payables 3,560"], 1],49:["During the period, Alisa has paid input sales tax of $450 on her purchases and charged output sales tax of $300 on her sales. Alisa is now completing her sales tax return. What is the total amount of sales tax due to or from the tax authorities?", ["$150 due to the tax authorities", "$150 due from the tax authorities", "$750 due from the tax authorities", "$750 due to the tax authorities"], 1],50:["Slava input a supplier invoice for $590 to the purchases module of her computerised accounting system as $950. What type of error is this?", ["Error of capital", "Error of commission", "Error of principle", "Error of original entry"], 3]};
PAPERS[9]={t:"Part 9: Mock Test 1 (Sep 18 – Aug 19)",q:[]};NUM[9]=[];X[9]={1:["When carrying out a reconciliation between the non-current assets in her asset register and the assets which she can physically identify, Wilma could not find one of the assets which is recorded in her asset register. Could each of the following reasons explain the discrepancy?", ["The supplier's invoice has not yet been received", "No record was made when the asset was sold"], [1, 0], "t", ["Yes", "No"]],2:["Jerome's receivables ledger has balances totalling $57,840. He has decided to write off an irrecoverable debt of $320. His receivables allowance at the last year end was $1,368. He has calculated that this should be revised to $1,247. What is the resulting charge to Jerome's statement of profit or loss?", [], 199, "n"],3:["'A business should apply the same accounting treatment to similar items from one accounting period to the next.' What accounting principle is described by the statement above?", ["Going concern", "Materiality", "Consistency", "Business entity"], 2],4:["Which of the following statements describes the qualitative characteristic of 'relevance'?", ["Information which can easily be understood", "Information which is capable of making a difference in the decisions made by users", "Information which is unbiased", "Information which is free from material error"], 1],5:["Since Petra commenced trading the cost of the items she sells has increased. Petra is trying to decide how her profit for the year will be affected by the method she uses to value her inventory. Which TWO of the following statements are correct?", ["First-in first-out will report a lower profit than weighted average", "Weighted average will report a lower profit than first-in first-out", "Profit for the year is affected by the method of inventory valuation", "Petra should value inventory on the basis that reports the lowest profit"], [1, 2], "m"],6:["Agnes sold some items of inventory for $1,950 cash. She had bought the items for $2,622. How are her assets and capital affected by the sale?", ["Assets reduced by $2,622, Capital reduced by $672", "Assets increased by $672, Capital increased by $2,622", "Assets reduced by $672, Capital reduced by $672", "Assets increased by $1,950, Capital reduced by $672"], 2],7:["Wasim has prepared the following receivables reconciliation:<br>Total of list of balances 19,738<br>Discount not recorded in personal account (29)<br>Balance on receivables control account 19,709<br>Invoice not recorded in day book 1,627 = 21,336<br>Contra with payables ledger not recorded (2,628) = 18,708<br>What value should be reported in Wasim's statement of financial position for receivables?", [], 18708, "n"],8:["Elaine is preparing her bank reconciliation and has noted some errors. Do each of these errors require an entry in the bank account in her general ledger?", ["A cheque payable to S Wright has not been presented at the bank", "The bank has levied charges on her account"], [1, 0], "t", ["Yes", "No"]],9:["Bill uses the first-in first-out method of inventory valuation. At 1 May 20X8 he had 60 units in inventory at a total value of $1,320. The movement in inventory in May 20X8 was:<br>Receipts: 14 May 120 units at $22.20; 26 May 150 units at $22.30<br>Sales: 18 May 90 units; 28 May 80 units<br>What is the value of Bill's inventory at 31 May 20X8?", [], 3567, "n"],10:["Ethel's trial balance includes: Trade receivables $136,853 Dr; Receivables allowance $14,862 Cr.<br>Assuming there are no other balances, what current asset and current liability balances should be reported on Ethel's statement of financial position?", ["Current liability", "Current asset"], [0, 2], "t", ["nil", "$14,862", "$121,991", "$136,853"]],11:["Estelle has prepared the following journal entry: Dr Cash $500; Cr T Simpkins $500. What is the correct narrative for the journal entry?", ["Cash received from T Simpkins", "Cash paid to T Simpkins", "Cash purchase from T Simpkins", "Cash sale to T Simpkins"], 0],12:["At 31 October 20X6 Gina Dobbs owed her suppliers $13,856. During the year to 31 October 20X7 her payments to suppliers totalled $95,886 and at 31 October 20X7 she owed her suppliers $11,552. What is the value of Gina's credit purchases for the year to 31 October 20X7?", [], 93582, "n"],13:["In the general ledger what should the balance on the receivables ledger control account show?", ["The total amount owed by the business to its suppliers", "The total amount due to the business from its customers", "The difference between the amount owed to suppliers and due from customers", "The total amount received from customers during the accounting period"], 1],14:["In the year to 30 November 20X7 Grace Smith obtained a 25% mark up on all her sales. Her sales for the year totalled $120,600. Her opening inventory was valued at $9,340 and her closing inventory was valued at $11,855. What was the value of Grace's purchases for the year?", [], 98995, "n"],15:["In the year to 31 May 20X9 Ina's sales were $174,820 and her cost of sales was $139,856. What were her gross profit margin and mark up?", ["Margin", "Mark up"], [0, 1], "t", ["20%", "25%"]],16:["A company has the following ledger accounts: Receivables Control Account – Dr Table and chair sales $3,000; Table Sales – Cr Receivables control account $2,250; Chair Sales – Cr Receivables control account $750. Which of the following accounting entries would result in the amounts shown in these accounts?", ["Dr Receivables control account $3,000; Cr Table sales $2,250; Cr Chair sales $750", "Dr Receivables control account $3,000; Cr Table sales $3,000", "Dr Table sales returns $2,250; Dr Chair sales returns $750; Cr Receivables control account $3,000", "Dr Table sales $2,250; Dr Chair sales $750; Cr Receivables control account $3,000"], 0],17:["Does each of the following require an entry in a suspense account?", ["The debit and credit totals of the trial balance did not agree", "A customer paid $190 to settle an invoice with a value of $109"], [0, 1], "t", ["Yes", "No"]],18:["Val has extended and totalled her extended trial balance, but has not entered the profit or loss for the period. The total of the statement of financial position debit column is less than the total of the statement of financial position credit column. Which of the following is correct?", ["Val has made a profit, and the total of the statement of profit or loss debit column will be greater than the total of the statement of profit or loss credit column", "Val has made a loss, and the total of the statement of profit or loss debit column will be less than the total of the statement of profit or loss credit column", "Val has made a profit, and the total of the statement of profit or loss debit column will be less than the total of the statement of profit or loss credit column", "Val has made a loss, and the total of the statement of profit or loss debit column will be greater than the total of the statement of profit or loss credit column"], 3],19:["Do each of the following correctly describe why a bank reconciliation is prepared?", ["To identify errors in the entries in the cash book", "To identify entries which have been generated by the bank, but not recorded in the cash book"], [0, 0], "t", ["Yes", "No"]],20:["P and Q are in partnership sharing profits equally. On 30 June 20X5 R joined the partnership and it was agreed that from that date all three partners should share equally in the profit. In the year ended 31 December 20X5 the profit amounted to $300,000, accruing evenly over the year, after charging an irrecoverable debt of $30,000 which it was agreed should be borne equally by P and Q only. What should P's total profit share be for the year ended 31 December 20X5?", [], 122500, "n"],21:["Which of the following is the correct journal entry to record a credit note issued to a customer for goods returned?", ["Dr Sales returns Cr Cash", "Dr Sales returns Cr Trade receivables", "Dr Cash Cr Sales returns", "Dr Trade receivables Cr Sales returns"], 1],22:["At 1 November 20X8 the value of Claudia's net assets was $127,554. At 31 October 20X9 the value was $174,529. During the year Claudia introduced $35,000 of capital and her drawings were $17,150. What was Claudia's profit for the year to 31 October 20X9?", [], 29125, "n"],23:["Which of the following statements correctly describes current assets?", ["Assets which are expected to be converted into cash in the short term", "Assets which are not expected to be converted into cash in the short term", "Assets which are used to conduct the organisation's current business", "Assets which are currently located on the business premises"], 0],24:["Simeon has the following ledger balances at 30 September 20X8: Capital 6,260; Cash at bank 890; Expenses 17,410; Non-current assets 31,845; Opening inventory 4,820; Purchases 71,470; Payables 6,930; Receivables 15,870; Sales 129,270. Simeon thinks he may have posted only one side of a journal entry. What is the total of the credit side of Simeon's trial balance?", [], 142460, "n"],25:["What is the purpose of a trial balance?", ["To highlight certain errors that may have occurred in the double entry accounting system", "To keep a record of the total value of a number of similar but individual items in the ledger accounts", "To use instead of a set of final accounts if the business is small", "To keep the assets and liabilities of the business separate from the personal assets and liabilities of the business owners"], 0],26:["Bill obtains a 25% margin on all his sales. In the year to 31 March 20X0 he bought goods with a total value of $69,000. His closing inventory cost $3,000 less than his opening inventory. What is the value of Bill's sales in the year to 31 March 20X0?", [], 96000, "n"],27:["Shari is reconciling her trade payables control account with the list of balances in the purchase ledger. Errors: (1) A credit balance on a supplier's account has been listed as a debit balance (2) An invoice was recorded in the purchase day book for the wrong value (3) No record has been made of discount received from a supplier. Which of these errors require an entry in the trade payables control account in the general ledger?", ["2 and 3 only", "1 and 2 only", "1 and 3 only", "1, 2 and 3"], 0],28:["James and Claude share profit 3:2. On 1 June 20X7 they admit Ramón and change the ratio to 3:2:1 (James, Claude, Ramón). Capital balances on 1 June 20X7: James $68,000 Cr; Claude $52,000 Cr. Goodwill is valued at $36,000. Ramón pays $14,000 into the partnership, including $6,000 for his share of goodwill. Goodwill is not recorded in the accounts. What is James' capital balance immediately after Ramón has been admitted?", ["$54,400", "$89,600", "$71,600", "$68,000"], 2],29:["The totals of Kara's extended trial balance are: Statement of profit or loss – Debit $122,182, Credit $113,528; Statement of financial position – Debit $122,173, Credit $130,827. What is Kara's result for the year?", ["A profit of $8,654", "A loss of $8,654", "A profit of $8,645", "A loss of $8,645"], 1],30:["Which of the following statements is correct?", ["Accrued expenses increase the value of liabilities", "Prepaid expenses reduce the value of assets", "An accrued expense is recorded when the payment is made", "A prepayment arises when an expense is incurred before it is paid"], 0],31:["Gayle paid for office cleaning in cash. She made the following entries in her general ledger: Dr Trade payables; Cr Office cleaning expenses. Which accounts require an entry to correct this?", ["Office cleaning expenses, cash and trade payables", "Cash and trade payables only", "Office cleaning expenses and trade payables only", "Office cleaning expenses and cash only"], 0],32:["In which of the following circumstances would an entry be made in the non-current asset register? (1) When an asset is traded-in (2) When an asset is scrapped", ["Neither 1 nor 2", "2 only", "Both 1 and 2", "1 only"], 2],33:["When goods are sold to a customer on credit, what accounting entries should be recorded?", ["Dr Trade receivables account; Cr Sales account", "Dr Cash account; Cr Sales account", "Dr Sales account; Cr Trade receivables account", "Dr Sales account; Cr Cash account"], 0],34:["When preparing the reconciliation between the receivables ledger control account and the list of balances from the personal ledger Avril discovered: (1) An invoice for $375 was entered in the daybook as a credit note (2) An addition error meant that a customer's balance was understated in the personal ledger (3) Avril agreed to offset a balance in the receivables ledger against a balance in the payables ledger, but no entries were made. Which of the errors require an entry in the general ledger?", ["1 and 3 only", "1 and 2 only", "1, 2 and 3", "2 and 3 only"], 0],35:["In Sally's cash receipts book for July the trade receivables column showed a total of $2,500. What does this amount represent?", ["The amount paid by credit customers during July", "The amount owed to Sally by customers at the end of July", "The discounts allowed to credit customers for July", "The amount invoiced to customers during July"], 0],36:["On 1 January 20X8 Paul purchased plant and equipment costing $90,000. Paul's depreciation policy is to use a straight line basis over 10 years assuming a nil residual value. What will be the effect on Paul's profit and net assets for the year end December 20X8 if he changes his depreciation policy to the reducing balance basis at 30% per annum?", ["Profit will decrease by $18,000 and net assets will decrease by $18,000", "Profit will decrease by $18,000 and net assets will increase by $18,000", "Profit will increase by $18,000 and net assets will decrease by $18,000", "Profit will increase by $9,000 and net assets will increase by $9,000"], 0],37:["Mikel's customer asks him to pay costs of $5,500 for machine damage caused by a part he supplied. Mikel's offer to pay $3,000 ; Capital unchanged", "Assets unchanged; Liabilities reduced; Capital reduced", "Assets reduced; Liabilities unchanged; Capital reduced"], 0],43:["Which of the following items should be included in the calculation of the net profit for a partnership? (1) Interest on a loan from a partner (2) Salaries for employees (3) Salaries for partners", ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"], 0],44:["During the year to 30 April 20X8 Trevor wrote off a debt of $563 as irrecoverable. If in the year to 30 April 20X9 Trevor receives the $563 which was written off how will his financial statements for that year be affected by the receipt?", ["His profit will be increased by $563", "His profit will be reduced by $563", "His receivables balance will be reduced by $563", "His receivables balance will be increased by $563"], 0],45:["Which of the following statements is correct?", ["Financial statements do not provide useful information to lenders", "Financial statements are intended to meet the needs of a number of user groups", "Financial statements of a sole trader must be prepared by a qualified accountant", "All the information needs of the owner are met by the financial statements"], 1],46:["Chimwe purchased a new non-current asset, and paid for this by cheque. At the same time a bank loan was raised to provide some of the funds needed for the purchase. What entry correctly records the purchase of the non-current asset?", ["Dr Non-current assets; Cr Bank", "Dr Non-current assets; Cr Bank loan", "Dr Bank; Cr Non-current assets", "Dr Bank loan; Cr Non-current assets"], 0],47:["Are each of the following statements true or false?", ["The receivables ledger control account balance must be correct if it agrees with the total of the list of balances from the receivables ledger", "If there is a difference between the balance on the receivables ledger control account and the total of the list of balances from the receivables ledger the balance on the control account for(const k in PAPERS){const q=PAPERS[k].q;q.forEach((e,j)=>e.n=NUM[k][j]);for(const n in X[k]){const e=X[k][n];e.n=+n;q.push(e)}q.sort((a,b)=>a.n-b.n)}


const app=document.getElementById('app');
let sel=null,paper=null,i=0,ans=[],shown=[],tried=[],timer=null,secs=5700;
const typ=q=>q[3]||'s';
function num(a){return Math.abs(parseFloat(String(a).replace(/[,$\s]/g,'')))}
function ok(q,a){const t=typ(q);if(a==null||a==='')return false;
 if(t=='s')return a===q[2];
 if(t=='m')return a.length===q[2].length&&[...a].sort((x,y)=>x-y).join()===q[2].join();
 if(t=='t')return q[2].every((v,r)=>a[r]===v);
 const v=num(a);return !isNaN(v)&&Math.abs(v-q[2])<0.005}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function push(st,h){try{history.pushState(st,'',h)}catch(e){}}
function hdr(){
 const n=PAPERS[paper].q.length,pct=Math.round(i/n*100);
 return `<div class="hd"><div class="logo">ACCA</div>
 <div class="cell"><span>Question ${PAPERS[paper].q[i].n}</span></div>
 <div class="cell"><span id="mk">${ok(PAPERS[paper].q[i],ans[i])?'1 of 1':'0 of 1'} marks</span></div>
 <div class="cell"><span>Time Remaining</span><b id="tm">${fmt(secs)}</b></div>
 <div class="cell prog"><div class="bar"><i style="width:${pct}%"></i><span>Exam ${pct}% Complete</span></div><span style="color:var(--org);font-size:13px;margin-top:3px">&#9776; Test Progress Details &#9660;</span></div>
 <div class="cell org" style="border-left:1px solid var(--line)">FA2-Maintaining Financial Records</div>
 <div class="exit" onclick="home()"><u>&#10162;</u>Exit</div></div>`;
}
function renderHome(){
 clearInterval(timer);paper=null;
 app.innerHTML=`<main class="home"><div class="logo" style="margin:0 auto;height:56px;width:90px;font-size:26px">ACCA</div>
 <h1>FA2 – Maintaining Financial Records</h1><p>Choose a past paper section, then press Start.</p>
 ${Object.keys(PAPERS).map(k=>`<button class="pp ${sel==k?'sel':''}" onclick="sel=${k};renderHome()">Past Paper ${k}<small>${PAPERS[k].t} · ${PAPERS[k].q.length} questions</small></button>`).join('')}
 <button class="p" style="margin-top:12px" ${sel?'':'disabled'} onclick="start()">Start</button></main>`;
}
function home(){renderHome();push({v:'home'},'#home')}
function start(){paper=sel;i=0;ans=[];shown=[];tried=[];secs=5700;clearInterval(timer);
 timer=setInterval(()=>{secs--;const e=document.getElementById('tm');if(e)e.textContent=fmt(secs);if(secs<=0)finish()},1000);
 push({v:'q',i:0},'#q1');show()}
function go(n){i=n;push({v:'q',i:n},'#q'+(n+1));show()}
function show(){
 const q=PAPERS[paper].q[i],n=PAPERS[paper].q.length,t=typ(q),a=ans[i],sh=shown[i];let b='',sub='';
 if(t=='s'){
  b=q[1].map((o,k)=>{let cl='';if(a===k)cl=ok(q,a)?'ok':'bad';else if(sh&&k===q[2])cl='ok';
   return `<div class="opt ${cl}" onclick="pick(${k})"><span class="r"></span><span>${o}</span></div>`}).join('')}
 else if(t=='m'){
  const sa=a||[],full=sa.length>=q[2].length;sub=`<p class="sub">Select ${q[2].length} answers</p>`;
  b=q[1].map((o,k)=>{const on=sa.includes(k);let cl='';
   if(on){cl=full?(q[2].includes(k)?'ok':'bad'):'on'}else if(sh&&q[2].includes(k))cl='ok';
   return `<div class="opt ${cl}" onclick="pick(${k})"><span class="r sq ${on&&!full?'':''}"></span><span>${o}</span></div>`}).join('')}
 else if(t=='t'){
  b='<table class="tb"><tr><th></th>'+q[4].map(h=>`<th>${h}</th>`).join('')+'</tr>'+q[1].map((o,r)=>`<tr><td>${o}</td>`+q[4].map((h,k)=>{
   const on=(a||[])[r]===k;let cl='';
   if(on)cl=q[2][r]===k?'ok':'bad';else if(sh&&q[2][r]===k)cl='ok';
   return `<td class="${cl}" onclick="pick(${r},${k})"><span class="r ${on?'on':''}"></span></td>`}).join('')+'</tr>').join('')+'</table>'}
 else{
  const g=ok(q,a),bad=tried[i]&&!g&&a!=null&&a!=='';
  b=`<div style="font-size:16px">$ <input id="nv" class="nv ${g?'good':bad?'badv':''}" value="${a??''}" inputmode="decimal" autocomplete="off" oninput="numIn(this)" onkeydown="if(event.key=='Enter')sub()"></div>`+(sh?`<p class="hint">Correct answer: $${q[2].toLocaleString()}</p>`:'')}
 const nm=t=='n';
 app.innerHTML=hdr()+`<main><p class="q">${q[0]}</p>${sub}${b}<div class="nav"><button ${i?'':'disabled'} onclick="go(i-1)">Previous</button>`+
  (nm?'<button onclick="sub()">Check</button>':'')+`<button class="s" onclick="shown[i]=1;show()">Show answer</button>
  <button class="p" onclick="${i<n-1?'go(i+1)':'finish()'}">${i<n-1?'Next':'Finish'}</button></div></main>`}
function pick(k,k2){const q=PAPERS[paper].q[i],t=typ(q);
 if(t=='s')ans[i]=k;
 else if(t=='m'){const a=ans[i]=ans[i]||[],x=a.indexOf(k);
  if(x>=0)a.splice(x,1);
  else{if(a.length>=q[2].length){const w=a.findIndex(v=>!q[2].includes(v));if(w<0)return;a.splice(w,1)}a.push(k)}}
 else{(ans[i]=ans[i]||[])[k]=k2}
 show()}
function numIn(el){const q=PAPERS[paper].q[i];ans[i]=el.value;const g=ok(q,el.value);
 el.className='nv '+(g?'good':'');document.getElementById('mk').textContent=(g?'1':'0')+' of 1 marks'}
function sub(){const el=document.getElementById('nv');ans[i]=el.value;tried[i]=1;show();const e=document.getElementById('nv');if(e)e.focus()}
function showResult(){const q=PAPERS[paper].q,s=q.filter((x,k)=>ok(x,ans[k])).length;
 app.innerHTML=`<main class="res"><div class="logo" style="margin:0 auto 14px;height:48px;width:80px">ACCA</div><p>${PAPERS[paper].t}</p><p><b>Score: ${s} / ${q.length}</b></p><button class="p" onclick="home()">Back to papers</button></main>`}
function finish(){clearInterval(timer);showResult();push({v:'res'},'#result')}
addEventListener('popstate',e=>{const st=e.state;
 if(st&&st.v=='q'&&paper!=null){i=st.i;show()}
 else if(st&&st.v=='res'&&paper!=null){showResult()}
 else renderHome()});
try{history.replaceState({v:'home'},'','#home')}catch(e){}
renderHome();
</script></body></html>
